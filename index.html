<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akademik Asistan (Final Fixed)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            overflow-x: hidden;
        }
        
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .input-dark { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: white; 
            transition: all 0.3s; 
        }
        .input-dark:focus { border-color: #3b82f6; outline: none; }

        .signature { font-family: 'Sacramento', cursive; letter-spacing: -1px; }
        .screenshot-mode { background-color: #ffffff !important; color: #000000 !important; }
        .screenshot-mode .no-screenshot { display: none !important; }
        .screenshot-mode .glass { background: white !important; border: 1px solid #000 !important; color: black !important; box-shadow: none !important; }
        .screenshot-mode input { color: black !important; background: transparent !important; border: none !important; text-align: center; }

        .lesson-lisans { background: linear-gradient(135deg, #0d9488 0%, #115e59 100%) !important; border-left: 3px solid #5eead4 !important; color: white !important; } 
        .lesson-yuksek { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; border-left: 3px solid #a5b4fc !important; color: white !important; } 
        .lesson-doktora { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%) !important; border-left: 3px solid #fda4af !important; color: white !important; } 
        .lesson-seminer { background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; border-left: 3px solid #fcd34d !important; color: white !important; } 
        
        .btn-lisans { background-color: #0d9488; color: white; border: 1px solid #5eead4; }
        .btn-yuksek { background-color: #4f46e5; color: white; border: 1px solid #a5b4fc; }
        .btn-doktora { background-color: #e11d48; color: white; border: 1px solid #fda4af; }
        .btn-seminer { background-color: #d97706; color: white; border: 1px solid #fcd34d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // GÜVENLİ VERİ OKUMA VE VARSAYILAN DEĞERLER
        const safeGet = (key, def) => { 
            try { 
                const val = localStorage.getItem(key);
                return val ? JSON.parse(val) : def; 
            } catch (e) { 
                console.error("Veri okuma hatası, varsayılan değer kullanılıyor:", key);
                return def; 
            } 
        };

        const UNIVERSITIES = [
            { name: "Abant İzzet Baysal Üni.", city: "Bolu", url: "https://www.ibu.edu.tr/" },
            { name: "Anadolu Üni.", city: "Eskisehir", url: "https://www.anadolu.edu.tr/" },
            { name: "Ankara Üni.", city: "Ankara", url: "https://www.ankara.edu.tr/" },
            { name: "Atatürk Üni.", city: "Erzurum", url: "https://www.atauni.edu.tr/" },
            { name: "Boğaziçi Üni.", city: "Istanbul", url: "https://bogazici.edu.tr/" },
            { name: "Dokuz Eylül Üni.", city: "Izmir", url: "https://www.deu.edu.tr/" },
            { name: "Ege Üni.", city: "Izmir", url: "https://ege.edu.tr/" },
            { name: "Erciyes Üni.", city: "Kayseri", url: "https://www.erciyes.edu.tr/" },
            { name: "Gazi Üni.", city: "Ankara", url: "https://gazi.edu.tr/" },
            { name: "Hacettepe Üni.", city: "Ankara", url: "https://www.hacettepe.edu.tr/" },
            { name: "İstanbul Teknik Üni. (İTÜ)", city: "Istanbul", url: "https://www.itu.edu.tr/" },
            { name: "İstanbul Üni.", city: "Istanbul", url: "https://www.istanbul.edu.tr/" },
            { name: "Marmara Üni.", city: "Istanbul", url: "https://www.marmara.edu.tr/" },
            { name: "Necmettin Erbakan Üni.", city: "Konya", url: "https://www.erbakan.edu.tr/" },
            { name: "Orta Doğu Teknik Üni. (ODTÜ)", city: "Ankara", url: "https://www.metu.edu.tr/" },
            { name: "Selçuk Üni.", city: "Konya", url: "https://www.selcuk.edu.tr/" },
            { name: "Yıldız Teknik Üni.", city: "Istanbul", url: "https://yildiz.edu.tr/" },
            { name: "Diğer", city: "Ankara", url: "https://www.yok.gov.tr/" }
        ].sort((a, b) => a.name.localeCompare(b.name));

        const TITLES = ["Arş. Gör.", "Öğr. Gör.", "Dr. Öğr. Üyesi", "Doç. Dr.", "Prof. Dr."];
        const LESSON_TYPES = {
            "lisans": { label: "Lisans", className: "lesson-lisans", btnClass: "btn-lisans" },
            "yuksek": { label: "Y. Lisans", className: "lesson-yuksek", btnClass: "btn-yuksek" },
            "doktora": { label: "Doktora", className: "lesson-doktora", btnClass: "btn-doktora" },
            "seminer": { label: "Seminer", className: "lesson-seminer", btnClass: "btn-seminer" }
        };
        const DAYS_TR = ["Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi", "Pazar"];

        const DEFAULT_SCHEDULE = {
            Pazartesi: Array(13).fill(null), Sali: Array(13).fill(null), Carsamba: Array(13).fill(null), 
            Persembe: Array(13).fill(null), Cuma: Array(13).fill(null), Cumartesi: Array(13).fill(null), Pazar: Array(13).fill(null)
        };

        const App = () => {
            // STATE - Yeni anahtarlar (vFinalFixed) ile temiz başlangıç
            const [user, setUser] = useState(() => safeGet('user_vFinalFixed', null));
            const [tasks, setTasks] = useState(() => safeGet('tasks_vFinalFixed', []));
            const [notes, setNotes] = useState(() => safeGet('notes_vFinalFixed', []));
            
            // Schedule için ekstra güvenlik: Boş gelirse default yapıyı kullan
            const [schedule, setSchedule] = useState(() => {
                const s = safeGet('schedule_vFinalFixed', null);
                return s ? { ...DEFAULT_SCHEDULE, ...s } : DEFAULT_SCHEDULE;
            });

            const [timeSlots, setTimeSlots] = useState(() => safeGet('timeslots_vFinalFixed', ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"]));
            const [customScores, setCustomScores] = useState(() => safeGet('scores_vFinalFixed', []));
            const [targetScore, setTargetScore] = useState(() => safeGet('target_score_vFinalFixed', 100));
            
            const [view, setView] = useState("flow");
            const [activeModal, setActiveModal] = useState(null); 
            const [selectedNode, setSelectedNode] = useState(null);
            const [isScreenshotMode, setIsScreenshotMode] = useState(false);
            const [alertState, setAlertState] = useState(null); 
            const [conflictWarn, setConflictWarn] = useState(null);
            const [dismissedAlerts, setDismissedAlerts] = useState([]);
            
            const [editingTask, setEditingTask] = useState(null);
            const [newTask, setNewTask] = useState({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" });
            const [newNote, setNewNote] = useState("");
            const [isRecurring, setIsRecurring] = useState(false);
            const [recurringWeeks, setRecurringWeeks] = useState(14);
            const [editingLesson, setEditingLesson] = useState(null);
            
            const [newLesson, setNewLesson] = useState({ name: "", startTime: "09:00", endTime: "10:00", classroom: "", type: "lisans", days: [] });
            
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [currentTimeStr, setCurrentTimeStr] = useState("00:00");
            const [cursorColor, setCursorColor] = useState("bg-emerald-500 shadow-[0_0_10px_#10b981]");
            const [pomodoro, setPomodoro] = useState({ active: false, time: 25 * 60 });
            
            const audioRef = useRef(null);
            const [currentTime, setCurrentTime] = useState(new Date());

            // KAYIT İŞLEMLERİ
            useEffect(() => { if(user) localStorage.setItem('user_vFinalFixed', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('tasks_vFinalFixed', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('schedule_vFinalFixed', JSON.stringify(schedule)); }, [schedule]);
            useEffect(() => { localStorage.setItem('notes_vFinalFixed', JSON.stringify(notes)); }, [notes]);
            useEffect(() => { localStorage.setItem('scores_vFinalFixed', JSON.stringify(customScores)); }, [customScores]);
            useEffect(() => { localStorage.setItem('target_score_vFinalFixed', JSON.stringify(targetScore)); }, [targetScore]);
            useEffect(() => { localStorage.setItem('timeslots_vFinalFixed', JSON.stringify(timeSlots)); }, [timeSlots]);

            // HELPER
            const getMinutes = (timeStr) => { if(!timeStr) return 0; const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; };
            const getDayKey = (dateStr) => { const d = new Date(dateStr); const map = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"]; return map[d.getDay()]; };

            const checkConflict = (date, time) => {
                const taskExists = tasks.find(t => t.date === date && t.time === time && t.id !== editingTask?.id);
                if (taskExists) return `Çakışma: "${taskExists.title}"`;
                const dayKey = getDayKey(date);
                const daySchedule = schedule?.[dayKey];
                if (daySchedule && Array.isArray(daySchedule)) {
                    const taskMin = getMinutes(time);
                    for(let i=0; i<daySchedule.length; i++) {
                        if(daySchedule[i]) {
                            const slotTime = timeSlots[i] || "00:00";
                            const slotMin = getMinutes(slotTime);
                            const duration = daySchedule[i].duration ? parseInt(daySchedule[i].duration) : 1;
                            const lessonEndMin = slotMin + (duration * 60);
                            if (taskMin >= slotMin && taskMin < lessonEndMin) return `Çakışma: "${daySchedule[i].name}" dersi!`;
                        }
                    }
                }
                return null;
            };

            // HESAPLAMA MOTORU (Güvenli)
            const allEvents = useMemo(() => {
                if (!user) return []; 

                const now = new Date();
                const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (6 * 60); 
                const windowEnd = nowMinTotal + (18 * 60);
                
                let events = [];
                
                tasks.forEach(t => {
                    if (!t.date || !t.time) return;
                    const tDate = new Date(t.date); 
                    if (isNaN(tDate.getTime())) return;
                    const tMin = getMinutes(t.time); 
                    const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) {
                        events.push({ ...t, relativeMin, displayType: t.category });
                    }
                });

                if (prayerTimes && user.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => {
                        Object.keys(map).forEach(k => {
                            if(prayerTimes[k]) {
                                const tMin = getMinutes(prayerTimes[k]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ id: `p-${k}-${dayOffset}`, title: map[k], time: prayerTimes[k], relativeMin: tMin, displayType: "prayer", desc: dayOffset === 0 ? "Bugün" : (dayOffset === 1 ? "Yarın" : "Dün") });
                                }
                            }
                        });
                    });
                }

                [-1, 0, 1].forEach(dayOffset => {
                    const d = new Date(); d.setDate(d.getDate() + dayOffset);
                    const dayKey = DAYS_TR[d.getDay() === 0 ? 6 : d.getDay() - 1]; // Pazartesi = 0 indexliyoruz dizide ama getDay Pazar=0
                    // Düzeltme: DAYS_TR dizisi ["Pazartesi", ...] diye başlıyor.
                    // getDay: 0=Pazar, 1=Pazartesi.
                    // Bizim dizide Pazar sonda.
                    // Doğru eşleşme için manuel kontrol:
                    const dayMap = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"];
                    const currentDayName = dayMap[d.getDay()];
                    
                    const dayLessons = schedule?.[currentDayName];
                    if (dayLessons && Array.isArray(dayLessons)) {
                        dayLessons.forEach((l, i) => {
                            if (l) {
                                const tMin = getMinutes(timeSlots[i] || "00:00") + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) events.push({ id: `l-${dayOffset}-${i}`, title: l.name, time: timeSlots[i], relativeMin: tMin, displayType: "class", lType: l.type, desc: LESSON_TYPES[l.type].label, classroom: l.classroom });
                            }
                        });
                    }
                });

                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            // ANA DÖNGÜ
            useEffect(() => {
                if (!user) return; 

                const tick = () => {
                    const now = new Date(); setCurrentTime(now);
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    const nowTotalMin = now.getHours() * 60 + now.getMinutes();

                    // Cursor
                    const nextEvent = allEvents.find(ev => ev.relativeMin > nowTotalMin && ev.displayType !== 'prayer');
                    if (nextEvent) {
                        const diff = nextEvent.relativeMin - nowTotalMin;
                        if (diff <= 60) setCursorColor("bg-red-500 shadow-[0_0_15px_red]");
                        else if (diff <= 120) setCursorColor("bg-yellow-500 shadow-[0_0_10px_yellow]");
                        else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");
                    } else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");

                    // Alarm
                    const upcoming = allEvents.find(ev => {
                        const diff = ev.relativeMin - nowTotalMin;
                        return diff > 0 && diff <= 5 && ev.displayType !== 'prayer';
                    });

                    if (upcoming && !dismissedAlerts.includes(upcoming.id)) {
                        if (!alertState || alertState.id !== upcoming.id) {
                            setAlertState(upcoming);
                            try{ if(audioRef.current) audioRef.current.play(); } catch(e){}
                            if (Notification.permission === "granted") {
                                new Notification(`HATIRLATMA: ${upcoming.title}`, { body: `${upcoming.time}` });
                            }
                        }
                    } else if (alertState && (!upcoming || upcoming.id !== alertState.id)) {
                        setAlertState(null);
                    }

                    // Pomodoro
                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { 
                        setPomodoro({active: false, time: 25 * 60}); 
                        alert("Süre Doldu!"); 
                        try{ if(audioRef.current) audioRef.current.play(); } catch(e){}
                    }
                };

                tick(); 
                const timer = setInterval(tick, 1000); 
                if (user?.enablePrayer && user?.city && !prayerTimes) {
                    const fetchP = async () => { try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${user.city}&country=Turkey&method=13`); const json = await res.json(); if(json.data) setPrayerTimes(json.data.timings); } catch(e){} };
                    fetchP();
                }
                return () => clearInterval(timer);
            }, [allEvents, alertState, pomodoro.active, user, dismissedAlerts]);

            const dismissAlert = () => { if (alertState) { setDismissedAlerts(prev => [...prev, alertState.id]); setAlertState(null); if(audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; } } };
            
            const handleUpdateUser = (e) => { 
                e.preventDefault(); 
                const fd = new FormData(e.target); 
                const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); 
                if (!u) return; 
                setUser({ ...user, title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); 
                setActiveModal(null); 
                if ("Notification" in window) Notification.requestPermission();
            };

            const handleAddTask = () => { 
                if(!newTask.title || !newTask.date) return;
                if (!conflictWarn) {
                    let msg = checkConflict(newTask.date, newTask.time);
                    if (msg) { setConflictWarn(msg); return; }
                }
                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask, id: t.id } : t));
                    setEditingTask(null);
                } else {
                    let toAdd = [];
                    if (isRecurring) { 
                        const weeks = Math.min(Math.max(1, recurringWeeks||1), 52);
                        let d = new Date(newTask.date); 
                        for(let i=0; i<weeks; i++) { 
                            toAdd.push({...newTask, id: Date.now()+Math.random()+i, date: d.toISOString().split('T')[0]}); 
                            d.setDate(d.getDate() + 7); 
                        } 
                    } else { toAdd.push({...newTask, id: Date.now()+Math.random()}); } 
                    setTasks(prev => [...prev, ...toAdd]); 
                }
                setActiveModal(null); setConflictWarn(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); setIsRecurring(false);
            };

            const deleteTask = (e, id) => { e.stopPropagation(); if(confirm("Silmek istiyor musunuz?")) setTasks(prev => prev.filter(t => t.id !== id)); };

            const handleAddNewLesson = () => {
                if (!newLesson.name || !newLesson.startTime || !newLesson.endTime || newLesson.days.length === 0) return alert("Eksik bilgi!");
                const startMin = getMinutes(newLesson.startTime);
                const endMin = getMinutes(newLesson.endTime);
                if (endMin <= startMin) return alert("Saat hatası!");
                const duration = Math.ceil((endMin - startMin) / 60);
                const batchId = Date.now();
                const ns = { ...schedule };
                newLesson.days.forEach(day => {
                    let slot = -1;
                    for (let i = 0; i < timeSlots.length; i++) { if (getMinutes(timeSlots[i]) >= startMin) { slot = i; break; } }
                    if (slot !== -1) {
                        for (let i = 0; i < duration && (slot + i) < timeSlots.length; i++) {
                            if(!ns[day]) ns[day] = Array(13).fill(null);
                            ns[day][slot + i] = { name: newLesson.name, type: newLesson.type, classroom: newLesson.classroom, duration: 1, batchId, startTime: newLesson.startTime, endTime: newLesson.endTime };
                        }
                    }
                });
                setSchedule(ns); setActiveModal(null); setNewLesson({ name: "", startTime: "09:00", endTime: "10:00", classroom: "", type: "lisans", days: [] });
            };
            
            const totalCalculated = customScores.reduce((acc, curr) => acc + ((parseInt(curr.value)||0)*(parseInt(curr.count)||0)), 0);

            // GİRİŞ EKRANI
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
                            <h1 className="text-2xl font-bold text-white mb-2 text-center">Akademik Asistan</h1>
                            <p className="text-center text-slate-400 mb-6 text-sm">V2.5 • Final Fixed</p>
                            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); if (!u) return; setUser({ title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); }} className="space-y-4">
                                <select name="title" className="w-full input-dark p-3 rounded-lg">{TITLES.map(t=><option key={t} value={t}>{t}</option>)}</select>
                                <input name="name" required placeholder="Ad Soyad" className="w-full input-dark p-3 rounded-lg" />
                                <select name="uni" className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select>
                                <div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div>
                                <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-blue-500 transition">BAŞLAT</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ANA UYGULAMA
            return (
                <div className={isScreenshotMode ? "screenshot-mode bg-white min-h-screen text-black" : "max-w-md mx-auto min-h-screen bg-[#0f172a] pb-24 relative shadow-2xl overflow-hidden text-slate-100"}>
                    <audio ref={audioRef} src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
                    
                    {alertState && !isScreenshotMode && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-red-900/95 backdrop-blur-md animate-flash">
                            <div className="bg-white text-red-700 p-6 rounded-3xl shadow-2xl text-center max-w-sm mx-4 transform scale-110">
                                <i className="fas fa-exclamation-triangle text-6xl mb-4 animate-bounce"></i>
                                <h1 className="text-3xl font-bold mb-1">ALARM!</h1>
                                <p className="text-2xl font-bold text-black mb-2">{alertState.time}</p>
                                <p className="text-lg font-semibold">{alertState.title}</p>
                                <button onClick={dismissAlert} className="mt-6 w-full bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-lg">TAMAM</button>
                            </div>
                        </div>
                    )}
                    
                    <div className="pt-10 pb-6 px-6 bg-gradient-to-br from-blue-900 via-slate-900 to-slate-900 rounded-b-[40px] shadow-lg border-b border-blue-900/30 no-print z-20 relative no-screenshot">
                        <div className="absolute top-3 right-5 text-white/50 text-[10px] tracking-tighter signature z-50">Ömer Faruk Erdem</div>
                        <div className="flex justify-between items-start">
                            <div><h2 className="text-xl font-bold text-white">{user.name}</h2><div className="text-xs text-blue-300 mt-1">{user.title}</div></div>
                            <button onClick={() => setActiveModal('settings')} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-blue-400"><i className="fas fa-cog text-xs"></i></button>
                        </div>
                        <div className="mt-6 relative">
                            <div className="flex justify-between text-[10px] text-blue-200 font-mono mb-1"><span>-6s</span><span className="animate-pulse text-white font-bold">{currentTimeStr}</span><span>+18s</span></div>
                            <div className="h-16 relative w-full overflow-hidden flex items-center bg-slate-900 rounded-xl border border-slate-700 shadow-inner">
                                <div className="absolute top-1/2 left-0 w-full h-px bg-slate-600/50"></div>
                                <div className={`absolute top-0 bottom-0 w-1 z-30 left-[25%] transition-colors duration-500 ${cursorColor}`}></div>
                                {allEvents.map(ev => {
                                    const nowMin = currentTime.getHours() * 60 + currentTime.getMinutes();
                                    const ws = nowMin - (6 * 60);
                                    let diff = ev.relativeMin - ws;
                                    const pct = (diff / 1440) * 100;
                                    if(pct < 0 || pct > 100) return null;
                                    let col = "bg-gray-500";
                                    if(ev.displayType==='prayer') col="bg-white w-0.5 h-full top-0";
                                    else if(ev.displayType==='class') col="bg-emerald-500 w-3 h-3 rounded-full border-2 border-slate-900";
                                    else col="bg-blue-500 w-3 h-3 rounded-full border-2 border-slate-900";
                                    return (<div key={ev.id} className={`absolute top-1/2 -translate-y-1/2 z-20 cursor-pointer ${col}`} style={{left:`${pct}%`}} onClick={()=>{if(ev.displayType!=='prayer'&&ev.displayType!=='class') {setNewTask(ev); setEditingTask(ev); setActiveModal('task');}}}></div>);
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="p-4 space-y-4 no-screenshot">
                        {view === 'flow' && (
                            <div className="animate-enter space-y-3">
                                <h3 className="text-sm font-bold text-slate-400 uppercase border-b border-slate-700 pb-2 mb-4 ml-1">Günlük Akış</h3>
                                {allEvents.slice(0,25).map((item, i) => {
                                    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
                                    const isPast = item.relativeMin < nowMin;
                                    let border = 'border-slate-600';
                                    if(item.displayType==='prayer') border='border-white';
                                    else if(item.displayType==='class') border='border-emerald-500';
                                    else border='border-blue-500';
                                    return (
                                        <div key={i} className={`glass rounded-lg flex overflow-hidden border-l-4 ${border} ${isPast?'opacity-40 grayscale':''} transition-all duration-500`}>
                                            <div className="flex-1 p-3 flex items-center gap-3 cursor-pointer" onClick={()=>{if(item.displayType!=='prayer'&&item.displayType!=='class') {setNewTask(item); setEditingTask(item); setActiveModal('task');}}}>
                                                <div className="text-center min-w-[50px] font-mono font-bold text-lg text-slate-300">{item.time}</div>
                                                <div className="flex-1"><div className="font-bold text-sm text-white">{item.title}</div><div className="text-xs text-slate-500">{item.desc} {item.classroom && `• ${item.classroom}`}</div></div>
                                            </div>
                                            {item.displayType !== 'prayer' && item.displayType !== 'class' && <button onClick={(e) => deleteTask(e, item.id)} className="w-12 bg-red-900/20 text-red-400"><i className="fas fa-trash"></i></button>}
                                        </div>
                                    );
                                })}
                                {allEvents.length === 0 && <div className="text-center py-10 text-slate-500 text-sm">Akış boş.</div>}
                            </div>
                        )}

                        {view === 'home' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => { const today = new Date().toISOString().split('T')[0]; setNewTask({title:"", date:today, time:"", desc:"", type:"task", category:"daily"}); setActiveModal('task'); setConflictWarn(null); }} className="bg-gradient-to-br from-blue-600 to-blue-700 text-white p-6 rounded-xl flex flex-col items-center justify-center gap-2 shadow-lg"><i className="fas fa-bell text-2xl"></i><span className="font-bold text-xs">HATIRLATICI</span></button>
                                    <button onClick={() => setActiveModal('notes')} className="bg-slate-700 text-white p-6 rounded-xl flex flex-col items-center justify-center gap-2 border border-slate-600 shadow-lg"><i className="fas fa-sticky-note text-2xl text-yellow-400"></i><span className="font-bold text-xs">NOTLAR</span></button>
                                </div>
                                <button onClick={() => setView('schedule')} className="w-full bg-slate-800 p-4 rounded-xl flex items-center justify-between border border-slate-700 hover:bg-slate-700"><span className="font-bold text-sm">Haftalık Ders Programı</span><i className="fas fa-chevron-right text-slate-500"></i></button>
                                <button onClick={() => { setNewLesson({ name: "", startTime: "09:00", endTime: "10:00", classroom: "", type: "lisans", days: [] }); setActiveModal('addLesson'); }} className="w-full bg-emerald-700 p-4 rounded-xl flex items-center justify-center gap-2 text-white font-bold"><i className="fas fa-plus"></i> DERS EKLE</button>
                            </div>
                        )}

                        {view === 'schedule' && (
                            <div className="glass rounded-xl overflow-hidden border border-slate-700">
                                <div className="p-3 bg-slate-800/50 flex justify-between items-center no-screenshot"><span className="text-xs font-bold text-slate-400">PROGRAM</span><button onClick={() => setIsScreenshotMode(true)} className="bg-blue-600 px-2 py-1 rounded text-[10px] font-bold"><i className="fas fa-camera mr-1"></i>Ekran G.</button></div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs border-collapse">
                                        <thead className="bg-slate-900 text-slate-400"><tr><th className="p-2 border border-slate-800">Saat</th>{Object.keys(schedule).map(d=><th key={d} className="p-2 border border-slate-800">{d.substring(0,3)}</th>)}</tr></thead>
                                        <tbody>
                                            {timeSlots.map((t, i) => (
                                                <tr key={i}>
                                                    <td className="p-1 border border-slate-800 text-center"><input type="time" className="bg-transparent text-center text-slate-500 w-full" value={t} onChange={e=>{const n=[...timeSlots];n[i]=e.target.value;setTimeSlots(n)}} /></td>
                                                    {Object.keys(schedule).map(d => {
                                                        const l = schedule[d] && schedule[d][i];
                                                        return <td key={d} className="p-1 border border-slate-800 h-12 relative cursor-pointer" onClick={()=>{if(!isScreenshotMode){setEditingLesson({day:d, index:i, data:l?{...l}:{name:"",type:"lisans",classroom:""}}); setActiveModal('lesson');}}}>{l ? <div className={`w-full h-full rounded p-1 text-[9px] font-bold text-center ${LESSON_TYPES[l.type].className}`}>{l.name}</div> : null}</td>
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'promotion' && (<div className="pb-20"><div className="glass p-4 rounded-xl border border-blue-500/20"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-slate-300 text-sm">PUAN CETVELİ</h3><button onClick={() => setCustomScores([...customScores, {id:Date.now(), name:"", value:0, count:0}])} className="text-[10px] bg-blue-600 text-white px-3 py-1.5 rounded hover:bg-blue-500"><i className="fas fa-plus mr-1"></i>Ekle</button></div><div className="space-y-2">{customScores.map(s => (<div key={s.id} className="grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-2 rounded border border-slate-700"><div className="col-span-5"><input className="w-full bg-transparent text-sm text-slate-200" placeholder="Faaliyet" value={s.name} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,name:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-slate-400 rounded" value={s.value} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,value:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-white font-bold rounded border border-slate-600" value={s.count} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,count:e.target.value}:x))} /></div><div className="col-span-2 text-center text-xs font-bold text-blue-400">{(parseInt(s.value)||0)*(parseInt(s.count)||0)}</div><div className="col-span-1 text-right"><button onClick={()=>setCustomScores(customScores.filter(x=>x.id!==s.id))} className="text-slate-600 hover:text-red-400"><i className="fas fa-trash-alt"></i></button></div></div>))}</div><div className="mt-6 bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-xl"><div className="flex justify-between items-center mb-4"><span className="text-xs text-slate-400 uppercase font-bold">Hedef:</span><input type="number" className="w-20 bg-slate-900 border border-slate-600 rounded p-1 text-center text-sm font-bold text-white" value={targetScore} onChange={e => setTargetScore(parseInt(e.target.value)||0)} /></div><div className="flex justify-between text-sm font-bold mb-2"><span className="text-slate-300">DURUM</span><span className={totalCalculated>=targetScore?"text-emerald-400":"text-rose-400"}>{totalCalculated} / {targetScore}</span></div><div className="h-3 bg-slate-900 rounded-full overflow-hidden mb-2 border border-slate-700/50"><div className={`h-full transition-all duration-1000 ${totalCalculated>=targetScore?'bg-emerald-500':'bg-gradient-to-r from-blue-600 to-red-600'}`} style={{width: `${Math.min((totalCalculated/targetScore)*100, 100)}%`}}></div></div></div></div>)}
                    </div>
                    
                    {/* MODALLER */}
                    {activeModal === 'task' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl"><h3 className="text-white font-bold mb-4">{editingTask ? 'Görevi Düzenle' : 'Yeni Hatırlatıcı'}</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder="Başlık" value={newTask.title} onChange={e=>{setNewTask({...newTask,title:e.target.value}); setConflictWarn(null);}} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">Gündelik</option><option value="official">Resmi</option><option value="special">Özel</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>{setNewTask({...newTask,time:e.target.value}); setConflictWarn(null);}} /></div><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>{setNewTask({...newTask,date:e.target.value}); setConflictWarn(null);}} /><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder="Açıklama..." value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea><div className="flex items-center gap-2"><input type="checkbox" checked={isRecurring} onChange={e=>setIsRecurring(e.target.checked)} className="w-4 h-4" disabled={!!editingTask}/><span className="text-xs text-slate-300">Haftalık Tekrar?</span>{isRecurring && <input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-12 bg-slate-900 text-white text-center rounded" />}</div></div><div className="flex gap-2 mt-4"><button onClick={()=>setActiveModal(null)} className="flex-1 py-3 rounded bg-slate-700 text-slate-400">İptal</button><button onClick={handleAddTask} className={`flex-1 py-3 rounded text-white font-bold ${conflictWarn ? 'bg-red-600' : 'bg-blue-600'}`}>{conflictWarn ? 'Yine de Ekle?' : (editingTask ? 'Güncelle' : 'Kaydet')}</button></div>{conflictWarn && <div className="mt-2 text-center text-xs text-red-300">{conflictWarn}</div>}</div></div>)}
                    {activeModal === 'addLesson' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto"><h3 className="text-white font-bold mb-4">Yeni Ders Ekle</h3><div className="space-y-4"><div><label className="text-xs text-slate-400">Ders Adı</label><input className="w-full input-dark p-3 rounded" value={newLesson.name} onChange={e=>setNewLesson({...newLesson, name:e.target.value})} /></div><div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-400">Başlangıç</label><input type="time" className="w-full input-dark p-3 rounded" value={newLesson.startTime} onChange={e=>setNewLesson({...newLesson, startTime:e.target.value})} /></div><div><label className="text-xs text-slate-400">Bitiş</label><input type="time" className="w-full input-dark p-3 rounded" value={newLesson.endTime} onChange={e=>setNewLesson({...newLesson, endTime:e.target.value})} /></div></div><div><label className="text-xs text-slate-400">Sınıf</label><input className="w-full input-dark p-3 rounded" value={newLesson.classroom} onChange={e=>setNewLesson({...newLesson, classroom:e.target.value})} /></div><div><label className="text-xs text-slate-400 block mb-1">Ders Tipi</label><div className="grid grid-cols-2 gap-2">{Object.entries(LESSON_TYPES).map(([k,v])=>(<button key={k} onClick={()=>setNewLesson({...newLesson, type:k})} className={`p-2 rounded border text-xs ${newLesson.type===k?'border-white':'opacity-50'} ${v.btnClass}`}>{v.label}</button>))}</div></div><div><label className="text-xs text-slate-400 block mb-2">Günler</label><div className="grid grid-cols-4 gap-1">{DAYS_TR.map(d=><button key={d} onClick={()=>setNewLesson(p=>({...p, days:p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d]}))} className={`p-1 text-[10px] rounded ${newLesson.days.includes(d)?'bg-blue-600 text-white':'bg-slate-700 text-slate-400'}`}>{d.substring(0,3)}</button>)}</div></div></div><div className="flex gap-2 mt-6"><button onClick={()=>setActiveModal(null)} className="flex-1 py-3 rounded bg-slate-700 text-slate-400">İptal</button><button onClick={handleAddNewLesson} className="flex-1 py-3 rounded bg-emerald-600 text-white font-bold">Ekle</button></div></div></div>)}
                    {activeModal === 'lesson' && editingLesson && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl"><h3 className="text-white font-bold mb-4">Ders Düzenle</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" value={editingLesson.data.name} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} /><input className="w-full input-dark p-3 rounded" placeholder="Sınıf" value={editingLesson.data.classroom} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} /><div className="grid grid-cols-2 gap-2">{Object.entries(LESSON_TYPES).map(([k,v])=>(<button key={k} onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} className={`p-2 rounded border text-xs ${editingLesson.data.type===k?'border-white':'opacity-50'} ${v.btnClass}`}>{v.label}</button>))}</div></div><div className="flex gap-2 mt-4"><button onClick={()=>setSchedule(prev=>{const n={...prev}; if(n[editingLesson.day]) n[editingLesson.day][editingLesson.index]=null; return n;})||setActiveModal(null)} className="flex-1 py-3 rounded bg-slate-700 text-red-400">Sil</button><button onClick={()=>setSchedule(prev=>{const n={...prev}; if(n[editingLesson.day]) n[editingLesson.day][editingLesson.index]=editingLesson.data; return n;})||setActiveModal(null)} className="flex-1 py-3 rounded bg-blue-600 text-white font-bold">Kaydet</button></div></div></div>)}
                    {activeModal === 'notes' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col"><div className="flex justify-between mb-4"><h3 className="text-white font-bold">Notlar</h3><button onClick={()=>setActiveModal(null)}><i className="fas fa-times"></i></button></div><div className="flex gap-2 mb-4"><input className="flex-1 input-dark p-2 rounded" placeholder="..." value={newNote} onChange={e=>setNewNote(e.target.value)} /><button onClick={()=>{if(newNote) {setNotes([{id:Date.now(),text:newNote,date:new Date().toLocaleDateString()},...notes]); setNewNote("");}}} className="bg-blue-600 px-4 rounded text-white"><i className="fas fa-plus"></i></button></div><div className="flex-1 overflow-y-auto space-y-2">{notes.map(n=><div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start"><div><p className="text-sm text-white">{n.text}</p><p className="text-[10px] text-slate-400">{n.date}</p></div><button onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div>)}</div></div></div>)}

                    <div className="fixed bottom-0 w-full max-w-md bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-4 pb-8 z-50 no-screenshot">
                        {[{id: 'flow', icon: 'stream', label: 'Akış'},{id: 'home', icon: 'home', label: 'Ana Sayfa'},{id: 'schedule', icon: 'table', label: 'Ders'},{id: 'promotion', icon: 'chart-pie', label: 'Puan'}].map(t => (<button key={t.id} onClick={() => setView(t.id)} className={`flex flex-col items-center gap-1 ${view === t.id ? 'text-blue-400' : 'text-slate-500 hover:text-slate-400'}`}><i className={`fas fa-${t.icon} text-lg`}></i><span className="text-[10px] uppercase font-bold">{t.label}</span></button>))}
                    </div>
                    
                    {!isScreenshotMode && <button onClick={() => setPomodoro(prev => ({...prev, active: !prev.active}))} className={`fixed bottom-24 left-4 z-50 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all border border-slate-700 no-screenshot ${pomodoro.active ? 'bg-yellow-400 animate-pulse text-black' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>{pomodoro.active ? <span className="text-xs font-bold">{Math.floor(pomodoro.time/60)}:{String(pomodoro.time%60).padStart(2,'0')}</span> : <i className="fas fa-stopwatch text-xl"></i>}</button>}

                    {isScreenshotMode && (
                        <div className="printable-content text-black h-screen p-8 bg-white fixed top-0 left-0 w-full z-[100] overflow-auto">
                            <div className="text-center mb-6 border-b-2 border-black pb-4">
                                <h1 className="text-3xl font-bold text-black uppercase tracking-wide">{user.name}</h1>
                                <p className="text-lg text-gray-700 mt-1">{user.uni} • {user.title}</p>
                            </div>
                            <div className="w-full">
                                <h2 className="text-xl font-bold mb-4 text-center underline">HAFTALIK DERS PROGRAMI</h2>
                                <table className="w-full text-xs border-collapse">
                                    <thead><tr><th className="p-3 border border-black bg-gray-100 font-bold text-sm">Saat</th>{Object.keys(schedule).map(d=><th key={d} className="p-3 border border-black bg-gray-100 font-bold text-sm">{d}</th>)}</tr></thead>
                                    <tbody>
                                        {timeSlots.map((t, i) => (
                                            <tr key={i}>
                                                <td className="p-2 border border-black text-center font-bold bg-gray-50">{t}</td>
                                                {Object.keys(schedule).map(d => { 
                                                    const l = schedule[d] && schedule[d][i]; 
                                                    return <td key={d} className="p-1 border border-black h-12 text-center relative">{l && (<div className={`text-[10px] font-bold p-2 h-full flex flex-col items-center justify-center ${LESSON_TYPES[l.type].className}`} style={{border:'1px solid black',color:'white'}}><span className="block truncate w-full">{l.name}</span><span className="block text-[9px] bg-black/20 px-1 rounded my-0.5">{l.startTime} - {l.endTime}</span><span className="text-[8px] italic">{l.classroom}</span></div>)}</td>
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-10 text-center text-sm text-gray-400 italic">(Çıkmak için dokunun)</div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
