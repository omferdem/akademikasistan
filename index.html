    <script>
    // ============================================================
    // EXPO NATIVE BRIDGE - React Native WebView ile haberleşme
    // ============================================================
    
    // Native taraftan gelen mesajları dinle - Android için her iki yöntem
    function handleNativeMessage(event) {
        try {
            var msg = JSON.parse(event.data);
            if (msg.type === 'IMPORT_DATA' && msg.data) {
                // Native dosya seçiminden gelen veriyi işle
                try {
                    var data = JSON.parse(msg.data);
                    if(data.user) { localStorage.setItem('user_v48', JSON.stringify(data.user)); }
                    if(data.tasks) { localStorage.setItem('tasks_v48', JSON.stringify(data.tasks)); }
                    if(data.completedTasks) { localStorage.setItem('completed_tasks_v48', JSON.stringify(data.completedTasks)); }
                    if(data.schedule) { localStorage.setItem('schedule_v49', JSON.stringify(data.schedule)); }
                    if(data.customScores) { localStorage.setItem('scores_v48', JSON.stringify(data.customScores)); }
                    if(data.notes) { localStorage.setItem('notes_v48', JSON.stringify(data.notes)); }
                    if(data.academicCalendarUrl) { localStorage.setItem('academic_calendar_url_v48', JSON.stringify(data.academicCalendarUrl)); }
                    alert("✅ Yedek başarıyla yüklendi! Uygulama yenileniyor...");
                    setTimeout(function() { window.location.reload(); }, 1000);
                } catch(err) {
                    alert("❌ Hata: Dosya bozuk veya geçersiz format.");
                }
            } else if (msg.type === 'IMPORT_ERROR') {
                alert("❌ Dosya açılamadı: " + (msg.error || 'Bilinmeyen hata'));
            } else if (msg.type === 'EXPORT_SUCCESS') {
                alert("✅ Yedek dosyası kaydedildi ve paylaşım menüsü açıldı.");
            } else if (msg.type === 'PHOTO_SELECTED' && msg.images) {
                if (window.__addPhotos) window.__addPhotos(msg.images);
            } else if (msg.type === 'CALENDAR_PULL_SUCCESS' && msg.events) {
                localStorage.setItem('googleEvents_v1', JSON.stringify(msg.events));
                if (window.__onGooglePull) window.__onGooglePull(msg.events);
                alert('✅ ' + msg.events.length + ' etkinlik Google Calendar\'dan çekildi.');
            } else if (msg.type === 'CALENDAR_ADD_SUCCESS') {
                if (window.__onCalendarAddSuccess) window.__onCalendarAddSuccess(msg.id, msg.calendarEventId, msg.calendarId);
            } else if (msg.type === 'CALENDAR_SYNC_SUCCESS' && msg.results) {
                if (window.__onCalendarSyncSuccess) window.__onCalendarSyncSuccess(msg.results);
            }
        } catch(e) { console.error('Bridge hata:', e); }
    }
    
    // Android ve iOS için her iki event dinleyiciyi ekle
    window.addEventListener('message', handleNativeMessage);
    document.addEventListener('message', handleNativeMessage);
    
    // Native'e mesaj gönder (güvenli wrapper)
    function sendToNative(message) {
        try {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(message));
                return true;
            }
            return false;
        } catch(e) {
            return false;
        }
    }
    
    // Uygulama yüklenince tüm bildirimleri planla
    window.addEventListener('load', function() {
        setTimeout(function() {
            sendToNative({ type: 'APP_READY' });
            scheduleAllNotifications();
        }, 2000);
    });
    
    // Geri tuşu native'den gelince React'a ilet
    window.addEventListener('popstate', function() {
        if (window.__reactNavigateBack) window.__reactNavigateBack();
    });

    // Tüm görev bildirimlerini planla (10 dk önce)
    function scheduleAllNotifications() {
        try {
            var tasks = JSON.parse(localStorage.getItem('tasks_v48') || '[]');
            var schedule = JSON.parse(localStorage.getItem('schedule_v49') || '{}');
            var now = new Date();
            var minTime = new Date(now.getTime() + 11 * 1000); // en az 11 sn sonrası
            
            // Sadece gerçekten gelecekteki görevleri filtrele (tarih + saat bazlı)
            var upcoming = tasks.filter(function(t) {
                if (!t.date || !t.time || !t.title) return false;
                var parts = t.time.split(':');
                var taskDate = new Date(t.date + 'T00:00:00');
                taskDate.setHours(parseInt(parts[0]), parseInt(parts[1]), 0, 0);
                return taskDate.getTime() > minTime.getTime();
            });
            
            // Haftalık ders programından bildirim oluştur (7 gün için)
            var dayNames = ["Pazar","Pazartesi","Sali","Carsamba","Persembe","Cuma","Cumartesi"];
            var timeSlots = JSON.parse(localStorage.getItem('timeslots_v49') || '["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00"]');
            
            for (var dayOffset = 0; dayOffset < 7; dayOffset++) {
                var d = new Date(now);
                d.setDate(d.getDate() + dayOffset);
                var dayKey = dayNames[d.getDay()];
                var dateStr = d.toISOString().split('T')[0];
                var dayLessons = schedule[dayKey];
                if (dayLessons) {
                    dayLessons.forEach(function(lesson, i) {
                        if (lesson && lesson.name && timeSlots[i]) {
                            var lessonTime = lesson.startTime || timeSlots[i];
                            upcoming.push({
                                id: 'lesson-' + dayOffset + '-' + i,
                                title: '📚 ' + lesson.name + (lesson.classroom ? ' (' + lesson.classroom + ')' : ''),
                                date: dateStr,
                                time: lessonTime
                            });
                        }
                    });
                }
            }
            
            // Namaz vakitlerini de ekle (bugün ve yarın)
            try {
                var prayerData = localStorage.getItem('prayer_cache_v48');
                var prayerMap = {'Fajr':'İmsak','Sunrise':'Güneş','Dhuhr':'Öğle','Asr':'İkindi','Maghrib':'Akşam','Isha':'Yatsı'};
                if (prayerData) {
                    var pt = JSON.parse(prayerData);
                    var todayStr = now.toISOString().split('T')[0];
                    var tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
                    var tomorrowStr = tomorrow.toISOString().split('T')[0];
                    Object.keys(prayerMap).forEach(function(k) {
                        if (pt[k]) {
                            var time = pt[k].substring(0, 5); // HH:MM
                            upcoming.push({ id: 'prayer-today-' + k, title: '🕌 ' + prayerMap[k] + ' Vakti', date: todayStr, time: time });
                            upcoming.push({ id: 'prayer-tmrw-' + k, title: '🕌 ' + prayerMap[k] + ' Vakti', date: tomorrowStr, time: time });
                        }
                    });
                }
            } catch(pe) {}
            
            if (upcoming.length > 0) {
                sendToNative({ type: 'SCHEDULE_FUTURE_NOTIFICATIONS', tasks: upcoming, sound: localStorage.getItem('notif_sound_v48') ? JSON.parse(localStorage.getItem('notif_sound_v48')) : 'default' });
            }
        } catch(e) { console.error('scheduleAllNotifications hata:', e); }
    }
    </script>

        const P2PdfModal = ({ images, setImages, onClose, sendToNative }) => {
            const moveUp = (idx) => {
                if (idx === 0) return;
                setImages(prev => {
                    const arr = [...prev];
                    [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
                    return arr;
                });
            };
            const moveDown = (idx) => {
                setImages(prev => {
                    if (idx === prev.length-1) return prev;
                    const arr = [...prev];
                    [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
                    return arr;
                });
            };
            const removeImg = (idx) => {
                setImages(prev => prev.filter((_,i) => i !== idx));
            };
            const generatePdf = async () => {
                try {
                    if (!window.jspdf) { alert("PDF kütüphanesi yükleniyor, tekrar dene..."); return; }
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const w = doc.internal.pageSize.getWidth();
                    const h = doc.internal.pageSize.getHeight();
                    if (!images.length) { alert("Fotoğraf yok!"); return; }
                    for (let i = 0; i < images.length; i++) {
                        if (i > 0) doc.addPage();
                        try {
                            const props = doc.getImageProperties(images[i]);
                            const pw = w - 20;
                            const ph = Math.min((props.height * pw) / props.width, h - 25);
                            doc.addImage(images[i], 'JPEG', 10, 10, pw, ph);
                        } catch(e) {
                            try { doc.addImage(images[i], 'PNG', 10, 10, w-20, h-30); } catch(e2) {}
                        }
                        doc.setFontSize(10); doc.setTextColor(120,120,120);
                        doc.text('Sayfa '+(i+1), w/2, h-8, {align:'center'});
                    }
                    sendToNative({ type: 'SAVE_PDF', data: doc.output('datauristring'), filename: 'fotograflar.pdf' });
                } catch(e) { alert('PDF hatası: ' + e.message); }
            };
            return (
                <div style={{position:'fixed',inset:0,zIndex:9999,display:'flex',flexDirection:'column',background:'#0f172a'}}>

                    <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
                        {images.length === 0 ? (
                            <div onClick={() => sendToNative({type:'PICK_PHOTOS'})} style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'240px',border:'2px dashed #6d28d9',borderRadius:'16px',cursor:'pointer',gap:'12px'}}>
                                <span style={{fontSize:'48px'}}>🖼️</span>
                                <span style={{color:'#e2e8f0',fontWeight:'bold'}}>Buraya dokun, fotoğraf seç</span>
                                <span style={{color:'#64748b',fontSize:'13px'}}>Çoklu seçim yapabilirsin</span>
                            </div>
                        ) : (
                            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
                                {images.map((img, idx) => (
                                    <div key={idx} style={{display:'flex',alignItems:'center',gap:'8px',background:'#1e293b',borderRadius:'12px',padding:'8px',border:'1px solid #334155'}}>
                                        <img src={img} style={{width:'72px',height:'72px',objectFit:'cover',borderRadius:'8px',flexShrink:0}} />
                                        <div style={{flex:1,display:'flex',flexDirection:'column',gap:'4px'}}>
                                            <span style={{color:'#94a3b8',fontSize:'12px'}}>Fotoğraf {idx+1}</span>
                                            <div style={{display:'flex',gap:'6px'}}>
                                                <button onClick={() => moveUp(idx)} disabled={idx===0} style={{flex:1,padding:'4px',background:idx===0?'#1e293b':'#334155',color:idx===0?'#475569':'white',border:'none',borderRadius:'6px',cursor:idx===0?'default':'pointer',fontSize:'14px'}}>↑</button>
                                                <button onClick={() => moveDown(idx)} disabled={idx===images.length-1} style={{flex:1,padding:'4px',background:idx===images.length-1?'#1e293b':'#334155',color:idx===images.length-1?'#475569':'white',border:'none',borderRadius:'6px',cursor:idx===images.length-1?'default':'pointer',fontSize:'14px'}}>↓</button>
                                                <button onClick={() => removeImg(idx)} style={{flex:1,padding:'4px',background:'#7f1d1d',color:'white',border:'none',borderRadius:'6px',cursor:'pointer',fontSize:'14px'}}>🗑️</button>
                                            </div>

                        )}
                    </div>
                </div>
            );
        };

                if (diff <= 0) return '';

                if (diff <= 120) return 'heartbeat-slow';
                return '';
            };const renderTimelineBar = () => {

                            let diff = ev.relativeMin - windowStart; 
                            const positionPct = (diff / windowTotal) * 100;
                            
                            if (positionPct < 0 || positionPct > 100) return null;
                            
                            const isCompleted = completedTasks.includes(ev.id);
                            const isPast = ev.relativeMin < nowMin; // Geçmiş mi?

                            if (ev.displayType === 'prayer') nodeColor = "bg-white w-0.5 h-full rounded-none top-0 translate-y-0";

                                else if (ev.displayType === 'official') nodeColor = "bg-green-500 w-3 h-3 rounded-full border-2 border-slate-900";
                                else if (ev.displayType === 'special') nodeColor = "bg-pink-500 w-3 h-3 rounded-full border-2 border-slate-900"; 
                                else if (ev.displayType === 'class') nodeColor = "bg-emerald-500 w-3 h-3 rounded-full border-2 border-slate-900";
                            }

                            const heartbeat = getHeartbeatClass(ev.relativeMin, nowMin);
                            const opacityClass = isCompleted ? 'opacity-20' : isPast ? 'opacity-30' : '';
                            
                            return (<div key={ev.id} className={`absolute top-1/2 -translate-y-1/2 z-20 cursor-pointer ${nodeColor} ${heartbeat} ${opacityClass}`} style={{left: `${positionPct}%`}} onClick={() => { if(ev.displayType!=='prayer'&&ev.displayType!=='class') openEditTask(ev); else setSelectedNode(ev); }}></div>);

                                            <button
                                                key={s.id}
                                                onClick={() => { setNotifSound(s.id); sendToNative({type:'SET_NOTIF_SOUND', sound: s.id}); }}
                                                className={`p-2 rounded text-xs font-bold border transition ${notifSound===s.id ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}`}
                                            >{s.icon} {t(s.label)}</button>
                                        ))}
                                    </div>
                                </div>
                                <hr className="border-slate-700 my-4" /><div className="flex gap-2"><button onClick={exportData} className="flex-1 bg-green-900/50 border border-green-800 text-green-100 text-xs py-2 rounded hover:bg-green-800">{t('Yedek İndir (.json)')}</button><button onClick={importData} className="flex-1 bg-blue-900/50 border border-blue-800 text-blue-100 text-xs py-2 rounded hover:bg-blue-800">{t('Yedek Yükle')}</button></div><div className="flex gap-2 mt-2">
  <button onClick={()=>{if(window.confirm('Tüm etkinlikler Google Calendar\'a aktarılsın mı?')){sendToNative({type:'SYNC_ALL_TO_CALENDAR',tasks:tasks.filter(t=>t.date&&t.title)});}}} className="flex-1 bg-indigo-900/50 border border-indigo-700 text-indigo-200 text-xs py-2 rounded hover:bg-indigo-800 flex items-center justify-center gap-1"><i className="fab fa-google"></i> Calendar\'a Aktar</button>
  <button onClick={()=>{sendToNative({type:'PULL_FROM_CALENDAR'});}} className="flex-1 bg-purple-900/50 border border-purple-700 text-purple-200 text-xs py-2 rounded hover:bg-purple-800 flex items-center justify-center gap-1"><i className="fas fa-cloud-download-alt"></i> Calendar\'dan Çek</button>
</div>
{googleEvents.length > 0 && <p className="text-[10px] text-slate-500 mt-1 text-center">{googleEvents.length} Google etkinliği senkronize • <button onClick={()=>{if(window.confirm('Google etkinlikleri temizlensin mi?')){setGoogleEvents([]);}}} className="text-red-500 underline">Temizle</button></p>}</div></div>)}
                    
                    {/* GÖREV EKLEME/DÜZENLEME MODAL */}
                    {activeModal === 'task' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto"><h3 className="text-white font-bold mb-4">{editingTask ? t('Görevi Düzenle') : t('Yeni Hatırlatıcı')}</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder={t('Başlık')} value={newTask.title} onChange={e=>{setNewTask({...newTask,title:e.target.value}); setConflictWarn(null);}} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">{t('Gündelik İş (Mavi)')}</option><option value="academic">{t('Akademik (Kırmızı)')}</option><option value="official">{t('Resmi Toplantı (Yeşil)')}</option><option value="special">{t('Özel Gün (Pembe - Yıllık Tekrar)')}</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>{setNewTask({...newTask,time:e.target.value}); setConflictWarn(null);}} /></div><div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-slate-400 block mb-1">{t('Başlangıç Tarihi')}</label><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>{setNewTask({...newTask,date:e.target.value}); setConflictWarn(null);}} /></div><div><label className="text-xs text-slate-400 block mb-1">{t('Bitiş Tarihi')} <span className="text-slate-500">{t('(opsiyonel)')}</span></label><input type="date" className="w-full input-dark p-3 rounded" value={newTask.endDate||""} min={newTask.date||""} onChange={e=>setNewTask({...newTask,endDate:e.target.value})} /></div></div><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder={t('Açıklama...')} value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea>{newTask.category !== 'special' && (<div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700"><div className="mb-2"><span className="text-xs text-slate-300 font-bold">{t('Rutin Tekrar Seçeneği')}</span></div><select className="w-full input-dark p-2 rounded text-sm" value={recurringType} onChange={e=>setRecurringType(e.target.value)} disabled={!!editingTask}><option value="none">{t('Tekrar Yok')}</option><option value="weekly">{t('Haftalık')}</option><option value="biweekly">{t('İki Haftada Bir')}</option><option value="monthly">{t('Aylık')}</option></select>{recurringType !== "none" && recurringType !== "monthly" && (<div className="flex items-center gap-2 mt-2 animate-enter"><span className="text-[10px] text-slate-400">{t('Kaç Kez?')}</span><input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-16 bg-slate-900 border border-slate-600 rounded p-1 text-center text-white text-xs" /></div>)}{recurringType === "monthly" && (<p className="text-[10px] text-slate-400 mt-2">{t('12 ay boyunca her ay tekrarlanacak')}</p>)}</div>)}{newTask.category === 'special' && (<div className="bg-pink-900/20 p-3 rounded-lg border border-pink-700"><p className="text-xs text-pink-300"><i className="fas fa-info-circle mr-1"></i>{t('Özel günler her yıl otomatik olarak tekrarlanır')}</p></div>)}</div><div className="flex gap-2 mt-4"><button onClick={()=>{setActiveModal(null); setEditingTask(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily", endDate:""}); setRecurringType("none");}} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">{t('İptal')}</button><button onClick={handleAddTask} className={`flex-1 py-3 rounded text-white font-bold transition ${conflictWarn ? 'bg-red-600 hover:bg-red-700 animate-pulse' : 'bg-blue-600 hover:bg-blue-500'}`}>{conflictWarn ? '⚠️ ' + t('Yine de Ekle?') : (editingTask ? t('Güncelle') : t('Kaydet'))}</button></div>{conflictWarn && <div className="mt-2 text-center text-xs text-red-300 bg-red-900/20 p-2 rounded">{conflictWarn}</div>}</div></div>)}
                    
                    {/* NOTLAR MODAL */}
                    {activeModal === 'notes' && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl h-[60vh] flex flex-col"><div className="flex justify-between mb-4"><h3 className="text-white font-bold">{t('Not Defteri')}</h3><button onClick={()=>setActiveModal(null)}><i className="fas fa-times text-slate-400"></i></button></div><div className="flex gap-2 mb-4"><input className="flex-1 input-dark p-2 rounded" placeholder={t('Notunuz...')} value={newNote} onChange={e=>setNewNote(e.target.value)} /><button onClick={handleAddNote} className="bg-blue-600 px-4 rounded text-white"><i className="fas fa-plus"></i></button></div><div className="flex-1 overflow-y-auto space-y-2">{notes.map(n=><div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-start"><div><p className="text-sm text-white">{n.text}</p><p className="text-[10px] text-slate-400">{n.date}</p></div><button onClick={()=>setNotes(notes.filter(x=>x.id!==n.id))} className="text-red-400"><i className="fas fa-trash"></i></button></div>)}</div></div></div>)}
                    
                    {/* DERS DÜZENLEME MODALI */}
                    {activeModal === 'lesson' && editingLesson && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-white font-bold mb-4">{t('Ders Düzenle')}</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">{t('Ders Adı')}</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.name} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">{t('Başlangıç')}</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.startTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,startTime:e.target.value}})} 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">{t('Bitiş')}</label>
                                            <input 
                                                type="time" 
                                                className="w-full input-dark p-3 rounded" 
                                                value={editingLesson.data.endTime || ""} 
                                                onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,endTime:e.target.value}})} 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">{t('Sınıf/Derslik')}</label>
                                        <input 
                                            className="w-full input-dark p-3 rounded" 
                                            placeholder="örn: A101" 
                                            value={editingLesson.data.classroom || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,classroom:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">{t('Süre (Saat)')}</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="8" 
                                            className="w-full input-dark p-3 rounded" 
                                            value={editingLesson.data.duration || ""} 
                                            onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,duration:e.target.value}})} 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">{t('Tür (Renk Seçimi)')}</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {Object.entries(LESSON_TYPES).map(([k,v])=>(
                                                <button 
                                                    key={k} 
                                                    onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} 
                                                    className={`p-2 rounded border text-xs font-bold transition ${editingLesson.data.type===k?'ring-2 ring-white scale-105':'opacity-80'} ${v.btnClass}`}
                                                >
                                                    {t(v.label)}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mt-6">
                                    <button 
                                        onClick={() => {setActiveModal(null); setEditingLesson(null);}}
                                        className="py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600"
                                    >
                                        {t('Vazgeç')}
                                    </button>
                                    <button
                                        onClick={deleteLesson}
                                        className="py-3 rounded bg-red-900/50 text-red-400 hover:bg-red-900/70 border border-red-800"
                                    >
                                        {t('Sil')}
                                    </button>
                                    <button
                                        onClick={saveLesson}
                                        className="py-3 rounded bg-blue-600 text-white font-bold hover:bg-blue-500"
                                    >
                                        {t('Kaydet')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* GÜN DETAY MODALI */}
                    {activeModal === 'dayDetail' && dayDetailData && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[80vh] overflow-y-auto"><div className="flex justify-between items-center mb-4"><h3 className="text-white font-bold">{dayDetailData.date} {t('Detayı')}</h3><button onClick={() => { setActiveModal(null); setDayDetailData(null); }} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button></div><div className="space-y-3">{dayDetailData.events.map((ev, i) => (<div key={i} className={`p-3 rounded border-l-4 flex justify-between items-center ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-green-900/30 border-green-500': ev.category==='google'?'bg-amber-900/30 border-amber-500': ev.category==='special'?'bg-pink-900/30 border-pink-500':'bg-blue-900/30 border-blue-500'}`} onClick={() => { if(ev.origin === 'personal' && !ev.isRecurring) { openEditTask(ev); setDayDetailData(null); } }}><div><div className="text-sm font-bold text-white">{ev.event}{ev.isRecurring && <span className="text-[10px] ml-2 bg-pink-600 px-2 py-0.5 rounded">{t('Döngüsel')}</span>}</div>{ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}<div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div></div><div className="flex flex-col gap-1 ml-2">
  {ev.isGoogleEvent
    ? <span className="text-[10px] text-indigo-400 bg-indigo-900/30 border border-indigo-800 px-2 py-1 rounded flex items-center gap-1"><i className="fab fa-google"></i>Google</span>
    : <button onClick={(e)=>{e.stopPropagation(); sendToNative({type: ev.calendarEventId ? 'UPDATE_CALENDAR_EVENT' : 'ADD_TO_CALENDAR', event: ev.calendarEventId ? ev : {id:ev.id,title:ev.event||ev.title,date:ev.date||dayDetailData.date,time:ev.time||'',desc:ev.desc||''}, [ev.calendarEventId?'event':'event']: {id:ev.id,title:ev.event||ev.title,date:ev.date||dayDetailData.date,time:ev.time||'',desc:ev.desc||'',calendarEventId:ev.calendarEventId}});}} className={`text-xs px-2 py-1 rounded border flex items-center gap-1 ${ev.calendarEventId ? 'text-green-400 bg-green-900/30 border-green-800' : 'text-indigo-400 bg-indigo-900/30 border-indigo-800'}`}><i className="fab fa-google"></i>{ev.calendarEventId ? '✓' : 'Ekle'}</button>
  }
  {ev.origin === 'personal' && !ev.isRecurring && !ev.isGoogleEvent && <button onClick={(e) => deleteTask(e, ev.id)} className="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-900/30 rounded border border-red-900"><i className="fas fa-trash"></i></button>}
</div></div>))}</div><div className="mt-6 pt-4 border-t border-slate-700"><button onClick={() => { setNewTask({ title: "", date: dayDetailData.date, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm hover:bg-slate-600 transition flex items-center justify-center gap-2"><i className="fas fa-plus"></i> {t('Bu Güne Hatırlatıcı Ekle')}</button></div></div></div>)}
                </div>
            );
        }; // App fonksiyon kapanışı
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
