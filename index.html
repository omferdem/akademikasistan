        const ACADEMIC_DATA = {

        // PARLAK VE CANLI RENKLER (MATLIK GİDERİLDİ)
        const LESSON_TYPES = {

            "yuksek": { label: "Y. Lisans", color: "bg-fuchsia-500", tag: "YL", printColor: "#d946ef" },

            ]));
            const [customScores, setCustomScores] = useState(() => safeGet('scores_v30', [{ id: 1, name: "Makale", value: 20, count: 0 }]));
            const [targetScore, setTargetScore] = useState(() => safeGet('target_score_v30', 100));
            const [calendarEvents, setCalendarEvents] = useState(() => safeGet('calendar_v30', ACADEMIC_DATA['default']));

            // DEFAULT VIEW: FLOW (GÜNLÜK AKIŞ)
            const [view, setView] = useState("flow");
            
            const [showTaskModal, setShowTaskModal] = useState(false);
            const [showLessonModal, setShowLessonModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showDayDetailModal, setShowDayDetailModal] = useState(null);
            const [selectedNode, setSelectedNode] = useState(null);
            const [isScreenshotMode, setIsScreenshotMode] = useState(false);

            const [newTask, setNewTask] = useState({ title: "", date: "", time: "", desc: "", type: "task", category: "daily" });
            const [isRecurring, setIsRecurring] = useState(false);
            const [recurringWeeks, setRecurringWeeks] = useState(14);
            const [editingLesson, setEditingLesson] = useState(null);
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [progress, setProgress] = useState(0);
            const [currentTimeStr, setCurrentTimeStr] = useState("00:00");
            const [timeRange, setTimeRange] = useState({ start: 6, end: 23 });
            const [pomodoro, setPomodoro] = useState({ active: false, time: 25 * 60 });
            const fileInputRef = useRef(null);

            // SAVE
            useEffect(() => { localStorage.setItem('user_v30', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('tasks_v30', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('schedule_v30', JSON.stringify(schedule)); }, [schedule]);
            useEffect(() => { localStorage.setItem('calendar_v30', JSON.stringify(calendarEvents)); }, [calendarEvents]);
            useEffect(() => { localStorage.setItem('scores_v30', JSON.stringify(customScores)); }, [customScores]);
            useEffect(() => { localStorage.setItem('target_score_v30', JSON.stringify(targetScore)); }, [targetScore]);

            const getMinutes = (timeStr) => { if(!timeStr) return 0; const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; };
            
            const getUrgencyStatus = (taskTimeStr) => {
                const now = new Date(); const currentMinutes = now.getHours() * 60 + now.getMinutes(); const eventMinutes = getMinutes(taskTimeStr);
                if (currentMinutes > eventMinutes) return 'past';
                const diff = eventMinutes - currentMinutes;
                if (diff <= 60) return 'urgent'; if (diff <= 120) return 'soon'; return 'safe';
            };

            const getTimeline = useCallback(() => {
                const todayStr = new Date().toISOString().split('T')[0];
                let list = tasks.filter(t => t.date === todayStr).map(t => ({ ...t, sortTime: t.time, displayType: t.category }));
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    Object.keys(map).forEach(k => {
                        if(prayerTimes[k]) list.push({ id: `p-${k}`, title: map[k], time: prayerTimes[k], type: "prayer", displayType: "prayer", desc: "Vakit", sortTime: prayerTimes[k] });
                    });
                }
                const days = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"];
                const today = days[new Date().getDay()];
                if (schedule[today]) {
                    schedule[today].forEach((l, i) => {
                        if (l && l.name) {
                            const tStr = timeSlots[i] || "00:00";
                            list.push({ id: `l-${i}`, title: l.name, time: tStr, type: "class", displayType: "class", lType: l.type, desc: LESSON_TYPES[l.type].label, sortTime: tStr });
                        }
                    });
                }
                return list.sort((a, b) => a.sortTime.localeCompare(b.sortTime));
            }, [tasks, prayerTimes, user, schedule, timeSlots]);

            useEffect(() => {
                const tick = () => {
                    const now = new Date(); setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    const todaysEvents = getTimeline(); let minMin = 6 * 60; let maxMin = 23 * 60;
                    todaysEvents.forEach(e => { const m = getMinutes(e.time); if(m < minMin) minMin = Math.max(0, m - 30); if(m > maxMin) maxMin = Math.min(24*60, m + 60); });
                    const startH = Math.floor(minMin / 60); const endH = Math.ceil(maxMin / 60); 
                    setTimeRange(prev => (prev.start === startH && prev.end === endH ? prev : { start: startH, end: endH }));
                    const currentTotalMin = now.getHours() * 60 + now.getMinutes(); const rangeTotal = (endH * 60) - (startH * 60);
                    const p = Math.min(Math.max(((currentTotalMin - (startH * 60)) / rangeTotal) * 100, 0), 100); setProgress(p);
                };
                tick(); const timer = setInterval(tick, 1000); return () => clearInterval(timer);
            }, [getTimeline]);

            useEffect(() => { if (user?.enablePrayer && user?.city) fetchPrayerTimes(user.city); }, [user?.enablePrayer, user?.city]);

            useEffect(() => {
                let interval = null;
                if (pomodoro.active && pomodoro.time > 0) { interval = setInterval(() => { setPomodoro(prev => ({...prev, time: prev.time - 1})); }, 1000); } 
                else if (pomodoro.active && pomodoro.time === 0) { setPomodoro({active: false, time: 25 * 60}); alert("Odaklanma Bitti!"); }
                return () => clearInterval(interval);
            }, [pomodoro.active, pomodoro.time]);

            const fetchPrayerTimes = async (city) => { try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); const json = await res.json(); if(json.data) setPrayerTimes(json.data.timings); } catch (e) { console.error(e); } };
            const updateAcademicCalendar = (uniName) => { const newData = ACADEMIC_DATA[uniName] || ACADEMIC_DATA['default']; setCalendarEvents(newData); };
            const handleUpdateUser = (e) => { e.preventDefault(); const fd = new FormData(e.target); const foundUni = UNIVERSITIES.find(u => u.name === fd.get('uni')); if (!foundUni) return; updateAcademicCalendar(foundUni.name); setUser({ ...user, title: fd.get('title'), name: fd.get('name'), uni: foundUni.name, city: foundUni.city, url: foundUni.url, enablePrayer: fd.get('enablePrayer') === 'on' }); setShowSettingsModal(false); };
            const handleAddTask = () => { if(!newTask.title || !newTask.date) return; let newTasks = []; if (isRecurring) { let currentDate = new Date(newTask.date); for(let i=0; i<recurringWeeks; i++) { newTasks.push({ ...newTask, id: Date.now() + i, date: currentDate.toISOString().split('T')[0] }); currentDate.setDate(currentDate.getDate() + 7); } } else { newTasks.push({...newTask, id: Date.now()}); } setTasks([...tasks, ...newTasks]); setShowTaskModal(false); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); setIsRecurring(false); };

            const exportData = () => { const data = { user, tasks, schedule, customScores, targetScore }; const blob = new Blob([JSON.stringify(data)], {type: "application/json"}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `akademik_yedek_${new Date().toISOString().split('T')[0]}.json`; a.click(); };
            const importData = () => { const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json'; input.onchange = (e) => { const file = e.target.files[0]; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if(data.user) setUser(data.user); if(data.tasks) setTasks(data.tasks); if(data.schedule) setSchedule(data.schedule); if(data.customScores) setCustomScores(data.customScores); alert("Yedek yüklendi!"); window.location.reload(); } catch(err) { alert("Hata!"); } }; reader.readAsText(file); }; input.click(); };
            const handleFileUpload = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { const content = e.target.result; const lines = content.split(/\r\n|\n|\r/); let events = []; let currentEvent = null; lines.forEach(line => { if (line.startsWith('BEGIN:VEVENT')) currentEvent = {}; else if (line.startsWith('END:VEVENT')) { if (currentEvent && currentEvent.SUMMARY && currentEvent.DTSTART) { const rawDate = currentEvent.DTSTART.replace('VALUE=DATE:',''); const y = rawDate.substring(0,4); const m = rawDate.substring(4,6); const d = rawDate.substring(6,8); const h = rawDate.length > 8 ? rawDate.substring(9,11) : "08"; const min = rawDate.length > 8 ? rawDate.substring(11,13) : "00"; events.push({ id: Date.now() + Math.random(), title: currentEvent.SUMMARY, date: `${y}-${m}-${d}`, time: `${h}:${min}`, desc: "Takvimden", type: "task", category: "official", origin: "imported" }); } currentEvent = null; } else if (currentEvent) { const [key, val] = line.split(':'); if(key) currentEvent[key.split(';')[0]] = val; } }); setTasks([...tasks, ...events]); alert(`${events.length} etkinlik eklendi.`); }; reader.readAsText(file); };

            const handleDayClick = (dateStr, events) => {
                if (events.length > 0) {
                    setShowDayDetailModal({ date: dateStr, events });
                } else {
                    setNewTask({ title: "", date: dateStr, time: "09:00", desc: "", type: "task", category: "daily" });
                    setShowTaskModal(true);
                }
            };

            const getAllEvents = () => {
                const academicEvents = calendarEvents.map(e => ({ ...e, origin: 'academic', title: e.event, category: 'academic' }));
                const userEvents = tasks.map(t => ({ ...t, event: t.title, origin: t.origin || 'personal', category: t.category }));
                return [...academicEvents, ...userEvents];
            };

            const renderTimelineNodes = () => {
                const events = getTimeline(); const startM = timeRange.start * 60; const endM = timeRange.end * 60; const totalM = endM - startM;
                return events.map((ev, i) => {
                    const evM = getMinutes(ev.time); if (evM < startM || evM > endM) return null; const leftPct = ((evM - startM) / totalM) * 100;
                    let nodeClass = "w-3 h-3 rounded-full z-20 cursor-pointer shadow-lg transition-all"; 
                    let urgency = getUrgencyStatus(ev.time); 
                    let colorClass = "bg-gray-500"; 
                    if (urgency === 'past') { colorClass = "bg-slate-600 border border-slate-500 opacity-60"; } else if (ev.displayType === 'prayer') { return <div key={ev.id} className="absolute top-0 bottom-0 w-0.5 bg-white z-10 cursor-pointer" style={{ left: `${leftPct}%` }} onClick={() => setSelectedNode(ev)}></div>; } else { if (urgency === 'urgent') colorClass = "bg-red-500 border-2 border-slate-900 urgent-pulse scale-125"; else if (urgency === 'soon') colorClass = "bg-yellow-400 border-2 border-slate-900 scale-110"; else colorClass = "bg-emerald-500 border-2 border-slate-900"; }
                    return <div key={ev.id} className={`absolute top-1/2 -translate-y-1/2 flex items-center justify-center ${nodeClass} ${colorClass}`} style={{ left: `${leftPct}%` }} onClick={() => setSelectedNode(ev)}></div>;
                });
            };

            const totalCalculated = customScores.reduce((acc, curr) => acc + ( (parseInt(curr.value)||0) * (parseInt(curr.count)||0) ), 0);
            
            const appClass = isScreenshotMode ? "screenshot-mode bg-white min-h-screen text-black" : "max-w-md mx-auto min-h-screen bg-[#0f172a] pb-24 relative shadow-2xl overflow-hidden text-slate-100";

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
                            <h1 className="text-2xl font-bold text-white mb-2 text-center">Akademik Asistan</h1>
                            <p className="text-center text-slate-400 mb-6 text-sm">V30 • Final</p>
                            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); const foundUni = UNIVERSITIES.find(u => u.name === fd.get('uni')); if (!foundUni) return; updateAcademicCalendar(foundUni.name); setUser({ title: fd.get('title'), name: fd.get('name'), uni: foundUni.name, city: foundUni.city, url: foundUni.url, enablePrayer: fd.get('enablePrayer') === 'on' }); }} className="space-y-4">
                                <select name="title" className="w-full input-dark p-3 rounded-lg">{TITLES.map(t=><option key={t} value={t}>{t}</option>)}</select>
                                <input name="name" required placeholder="Ad Soyad" className="w-full input-dark p-3 rounded-lg" />
                                <select name="uni" className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select>
                                <div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div>
                                <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-blue-500 transition">BAŞLAT</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={appClass} onClick={() => isScreenshotMode && setIsScreenshotMode(false)}>
                    
                    {/* Header */}
                    <div className="pt-10 pb-6 px-6 bg-gradient-to-br from-blue-900 via-slate-900 to-slate-900 rounded-b-[40px] shadow-lg border-b border-blue-900/30 relative z-20 no-screenshot">
                        <div className="absolute top-3 right-5 text-white/50 text-[10px] tracking-tighter signature z-50 leading-none pointer-events-none">Ömer Faruk Erdem</div>
                        <div className="flex justify-between items-start">
                            <div><h2 className="text-2xl font-bold text-white">{user.name}</h2><div className="text-xs text-blue-300 mt-1">{user.title}</div></div>
                            <button onClick={(e) => { e.stopPropagation(); setShowSettingsModal(true); }} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-blue-400"><i className="fas fa-cog text-xs"></i></button>
                        </div>
                        <div className="mt-6 relative">
                            <div className="flex justify-between text-[10px] text-blue-200 font-mono mb-1"><span>{timeRange.start < 10 ? '0'+timeRange.start : timeRange.start}:00</span><span className="animate-pulse text-white font-bold">{currentTimeStr}</span><span>{timeRange.end}:00</span></div>
                            <div className="h-3 bg-slate-800 rounded-full relative w-full border border-slate-700 shadow-inner">
                                <div className="absolute top-0 left-0 h-full bg-slate-600/50 rounded-l-full" style={{width: `${progress}%`}}></div>
                                <div className="absolute top-0 bottom-0 w-0.5 bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)] z-10" style={{left: `${progress}%`, transition: 'left 1s'}}></div>
                                {renderTimelineNodes()}
                            </div>
                            {selectedNode && (<div className="absolute left-0 right-0 top-12 z-50 animate-enter flex justify-center"><div className="bg-slate-800 text-white text-xs p-3 rounded-xl shadow-2xl border border-slate-600 relative w-64 text-center"><button onClick={(e) => { e.stopPropagation(); setSelectedNode(null); }} className="absolute top-1 right-2 text-slate-400 hover:text-white"><i className="fas fa-times"></i></button><div className="font-bold text-sm mb-1 text-blue-300">{selectedNode.time} - {selectedNode.title}</div><div className="text-slate-400">{selectedNode.desc}</div></div></div>)}
                        </div>
                    </div>

                    <div className="p-4 space-y-4 no-screenshot">
                        {/* AKIŞ (FLOW) - ARTIK İLK SAYFA */}
                        {view === 'flow' && (
                            <div className="animate-enter space-y-3">
                                <h3 className="text-sm font-bold text-slate-400 uppercase border-b border-slate-700 pb-2 mb-4 ml-1">Günlük Akış</h3>
                                {getTimeline().length === 0 ? <div className="text-center py-12 opacity-30 text-sm border-2 border-dashed border-slate-700 rounded-xl">Akış boş.</div> : 
                                    getTimeline().map((item, i) => {
                                        const urgency = getUrgencyStatus(item.time); 
                                        let borderClass = 'border-slate-600 opacity-50'; 
                                        if (urgency !== 'past') { 
                                            if (item.displayType === 'prayer') borderClass = 'border-white'; 
                                            else if (urgency === 'urgent') borderClass = 'border-red-500 bg-red-900/10'; 
                                            else if (urgency === 'soon') borderClass = 'border-yellow-500 bg-yellow-900/10'; 
                                            else borderClass = 'border-emerald-500 bg-emerald-900/10'; 
                                        }
                                        return (<div key={i} className={`glass p-3 rounded-lg flex items-center gap-4 border-l-2 ${borderClass}`}><div className="text-center min-w-[50px] font-mono font-bold text-lg text-slate-300">{item.time}</div><div className="flex-1"><div className="flex items-center gap-2"><div className="font-bold text-sm text-white">{item.title}</div></div><div className="text-xs text-slate-500">{item.desc}</div></div>{item.type==='task' && <button onClick={() => setTasks(tasks.filter(t=>t.id!==item.id))} className="text-red-400 hover:text-red-300 p-2"><i className="fas fa-trash"></i></button>}</div>)
                                    })

                            </div>

                        {/* HOME (ESKİ ANA SAYFA - ŞİMDİ 2. SIRADA) */}
                        {view === 'home' && (
                            <div className="animate-enter space-y-4">
                                {user.url && (<button onClick={() => window.open(user.url, '_blank')} className="w-full bg-slate-800 border border-slate-600 text-blue-300 p-4 rounded-xl flex items-center justify-between hover:bg-slate-700 transition shadow-lg"><div className="flex items-center gap-4"><div className="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-white text-xl"><i className="fas fa-bullhorn"></i></div><div className="text-left"><div className="text-xs text-slate-400">Üniversite Paneli</div><div className="text-base font-bold text-white">Duyurular</div></div></div><i className="fas fa-chevron-right opacity-50"></i></button>)}
                                <div className="grid grid-cols-2 gap-4"><button onClick={() => { const today = new Date().toISOString().split('T')[0]; setNewTask({title:"", date:today, time:"", desc:"", type:"task", category:"daily"}); setShowTaskModal(true); }} className="bg-gradient-to-br from-blue-600 to-blue-700 text-white p-6 rounded-xl flex flex-col items-center justify-center gap-2 shadow-lg active:scale-95 transition"><i className="fas fa-bell text-3xl mb-1"></i><span className="font-bold text-sm">Hatırlatıcı Ekle</span></button><button onClick={() => setView('schedule')} className="bg-slate-800 text-slate-200 p-6 rounded-xl flex flex-col items-center justify-center gap-2 border border-slate-700 hover:bg-slate-700 transition"><i className="fas fa-edit text-3xl mb-1 text-purple-400"></i><span className="font-medium text-sm">Ders Programı</span></button></div>
                            </div>
                        )}

                        {view === 'annual' && (
                            <div className="animate-enter pb-16">
                                <div className="flex justify-between items-center mb-4"><h3 className="text-slate-300 font-bold text-sm uppercase">Yıllık Takvim</h3><div className="flex gap-2"><button onClick={() => fileInputRef.current.click()} className="text-[10px] bg-slate-800 px-3 py-1.5 rounded border border-slate-700 hover:border-blue-500 hover:text-white transition">ICS Yükle</button><input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" accept=".ics" /></div></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {Array.from({length: 12}, (_, i) => i).map(monthIdx => {
                                        const year = new Date().getFullYear(); const date = new Date(year, monthIdx, 1); const monthName = date.toLocaleString('tr-TR', { month: 'long' }); const daysInMonth = new Date(year, monthIdx + 1, 0).getDate(); const startDay = new Date(year, monthIdx, 1).getDay(); const offset = startDay === 0 ? 6 : startDay - 1;
                                        return (
                                            <div key={monthIdx} className="glass rounded-lg border border-slate-700 overflow-hidden">
                                                <div className="bg-slate-800 p-2 text-center font-bold text-blue-200 text-xs uppercase">{monthName}</div>
                                                <div className="grid grid-cols-7 text-[9px] text-slate-500 text-center py-1 bg-slate-900/30"><span>Pt</span><span>Sa</span><span>Ça</span><span>Pe</span><span>Cu</span><span>Ct</span><span>Pa</span></div>
                                                <div className="grid grid-cols-7 gap-px bg-slate-800 p-px">
                                                    {Array(offset).fill(null).map((_,k)=><div key={`e-${k}`} className="bg-slate-900 h-6"></div>)}
                                                    {Array(daysInMonth).fill(null).map((_,k)=>{
                                                        const d = k+1; const dStr = `${year}-${String(monthIdx+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const events = getAllEvents().filter(e => e.date === dStr);
                                                        let bg = "bg-slate-900 hover:bg-slate-700"; let text = "text-slate-500";
                                                        if(events.some(e => e.category === 'academic')) { bg = "bg-red-900"; text = "text-white font-bold"; }
                                                        else if(events.some(e => e.category === 'official')) { bg = "bg-amber-700"; text = "text-white font-bold"; }
                                                        else if(events.some(e => e.category === 'daily')) { bg = "bg-blue-900"; text = "text-white font-bold"; }
                                                        return (<button key={d} onClick={() => handleDayClick(dStr, events)} className={`h-6 flex items-center justify-center text-[9px] ${bg} ${text}`}>{d}</button>)
                                                    })}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'schedule' && (
                            <div className="animate-enter glass rounded-xl overflow-hidden border border-slate-700">
                                <div className="p-3 bg-slate-800/50 flex justify-between items-center no-screenshot">
                                    <div className="text-xs font-bold text-slate-400 uppercase">Haftalık Program</div>
                                    <button onClick={() => setIsScreenshotMode(true)} className="bg-blue-600 text-white px-3 py-1.5 rounded text-[10px] font-bold hover:bg-blue-500 flex items-center gap-1"><i className="fas fa-camera"></i> Ekran Görüntüsü Modu</button>
                                </div>
                                <div className="overflow-x-auto"><table className="w-full text-xs border-collapse"><thead className="bg-slate-900 text-slate-400"><tr><th className="p-2 w-16 border border-slate-800 text-center">Saat</th>{Object.keys(schedule).map(d=><th key={d} className="p-2 min-w-[80px] border border-slate-800 text-center">{d.substring(0,3)}</th>)}</tr></thead><tbody className="divide-y divide-slate-800">{timeSlots.map((t, i) => (<tr key={i} className="hover:bg-white/5"><td className="p-1 border border-slate-800 text-center"><input type="time" className="w-full bg-transparent text-center text-slate-500 rounded p-1 focus:text-white outline-none font-mono" value={t} onChange={e=>{const n=[...timeSlots];n[i]=e.target.value;setTimeSlots(n)}} /></td>{Object.keys(schedule).map(d => { const l = schedule[d][i]; return (<td key={d} className="p-1 border border-slate-800 h-12 relative cursor-pointer" onClick={() => { if(!isScreenshotMode){ setEditingLesson({day:d, index:i, data:l||{name:"",type:"lisans"}}); setShowLessonModal(true); } }}>{l ? <div className={`w-full h-full rounded flex items-center justify-center text-center p-1 text-[9px] font-bold border-l-2 shadow-sm ${LESSON_TYPES[l.type].color}`}>{l.name} <span className="ml-1 text-[7px] border border-white/30 px-1 rounded">{LESSON_TYPES[l.type].tag}</span></div> : <div className="w-full h-full hover:bg-white/5 rounded"></div>}</td>)})}</tr>))}</tbody></table></div></div>
                        )}

                        {view === 'promotion' && (
                            <div className="animate-enter pb-20"><div className="glass p-4 rounded-xl border border-blue-500/20"><div className="flex justify-between items-center mb-4"><h3 className="font-bold text-blue-400 text-sm">PUAN CETVELİ</h3><button onClick={() => setCustomScores([...customScores, {id:Date.now(), name:"", value:0, count:0}])} className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded"><i className="fas fa-plus mr-1"></i>Satır</button></div><div className="grid grid-cols-12 gap-1 text-[9px] text-slate-500 uppercase font-bold px-1 mb-2"><div className="col-span-5">Faaliyet</div><div className="col-span-2 text-center">Puan</div><div className="col-span-2 text-center">Adet</div><div className="col-span-2 text-center">Top.</div><div className="col-span-1"></div></div><div className="space-y-2">{customScores.map(s => (<div key={s.id} className="grid grid-cols-12 gap-2 items-center bg-slate-900/50 p-2 rounded border border-slate-800"><div className="col-span-5"><input className="w-full bg-transparent text-sm text-slate-200 focus:outline-none placeholder-slate-600" placeholder="Örn: Makale" value={s.name} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,name:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-slate-400 rounded p-1" value={s.value} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,value:e.target.value}:x))} /></div><div className="col-span-2"><input type="number" className="w-full bg-slate-900 text-center text-xs text-white font-bold rounded p-1 border border-slate-600" value={s.count} onChange={e=>setCustomScores(customScores.map(x=>x.id===s.id?{...x,count:e.target.value}:x))} /></div><div className="col-span-2 text-center text-xs font-bold text-emerald-400">{(parseInt(s.value)||0) * (parseInt(s.count)||0)}</div><div className="col-span-1 text-right"><button onClick={()=>setCustomScores(customScores.filter(x=>x.id!==s.id))} className="text-slate-600 hover:text-red-400"><i className="fas fa-trash-alt"></i></button></div></div>))}</div><div className="mt-6 bg-slate-900 p-4 rounded-xl border border-slate-700 shadow-xl"><div className="flex justify-between items-center mb-4"><span className="text-xs text-slate-400 uppercase font-bold">Hedef Puan:</span><input type="number" className="w-20 bg-slate-800 border border-slate-600 rounded p-1 text-center text-sm font-bold text-white focus:border-blue-500 outline-none" value={targetScore} onChange={e => setTargetScore(parseInt(e.target.value)||0)} /></div><div className="flex justify-between text-sm font-bold mb-2"><span className="text-slate-300">MEVCUT</span><span className={totalCalculated>=targetScore?"text-emerald-400":"text-rose-400"}>{totalCalculated} / {targetScore}</span></div><div className="h-3 bg-slate-800 rounded-full overflow-hidden mb-2 border border-slate-700/50"><div className={`h-full transition-all duration-1000 ${totalCalculated>=targetScore?'bg-emerald-500':'bg-gradient-to-r from-rose-500 to-orange-500'}`} style={{width: `${Math.min((totalCalculated/targetScore)*100, 100)}%`}}></div></div></div></div></div>
                        )}
                    </div>

                    {/* Screenshot Mode Overlay */}
                    {isScreenshotMode && (
                        <div className="printable-content text-black h-screen p-8 bg-white fixed top-0 left-0 w-full z-[100] overflow-auto">
                            <div className="text-center mb-6 border-b-2 border-black pb-4">
                                <h1 className="text-3xl font-bold text-black uppercase tracking-wide">{user.name}</h1>
                                <p className="text-lg text-gray-700 mt-1">{user.uni} • {user.title}</p>
                                <p className="text-xs text-gray-400 mt-1 signature">Ömer Faruk Erdem</p>
                            </div>
                            <div className="w-full">
                                <h2 className="text-xl font-bold mb-4 text-center underline">HAFTALIK DERS PROGRAMI</h2>
                                <table className="w-full text-xs border-collapse">
                                    <thead>
                                        <tr>
                                            <th className="p-3 border border-black bg-gray-100 font-bold text-sm">Saat</th>
                                            {Object.keys(schedule).map(d => <th key={d} className="p-3 border border-black bg-gray-100 font-bold text-sm">{d}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {timeSlots.map((t, i) => (
                                            <tr key={i}>
                                                <td className="p-2 border border-black text-center font-bold bg-gray-50">{t}</td>
                                                {Object.keys(schedule).map(d => {
                                                    const l = schedule[d][i];
                                                    return (
                                                        <td key={d} className="p-1 border border-black h-12 text-center relative">
                                                            {l && (
                                                                <div className={`text-[10px] font-bold p-2 h-full flex flex-col items-center justify-center ${LESSON_TYPES[l.type].color.replace('bg-', 'bg-opacity-20 bg-')}`} style={{border: '1px solid black'}}>
                                                                    <span>{l.name}</span>
                                                                    <span className="text-[8px] font-bold mt-1">({LESSON_TYPES[l.type].tag})</span>
                                                                </div>
                                                            )}
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-10 text-center text-sm text-gray-400 italic">
                                (Moddan çıkmak için ekrana dokunun)
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 w-full max-w-md bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-4 pb-8 z-50 no-screenshot">
                        {[
                            {id: 'flow', icon: 'stream', label: 'Akış'},
                            {id: 'home', icon: 'home', label: 'Ana Sayfa'},
                            {id: 'schedule', icon: 'table', label: 'Ders'},
                            {id: 'annual', icon: 'calendar-alt', label: 'Yıllık'},
                            {id: 'promotion', icon: 'chart-pie', label: 'Puan'}
                        ].map(t => (
                            <button key={t.id} onClick={() => setView(t.id)} className={`flex flex-col items-center gap-1 ${view === t.id ? 'text-blue-400' : 'text-slate-500'}`}><i className={`fas fa-${t.icon} text-lg`}></i><span className="text-[10px] uppercase font-bold">{t.label}</span></button>
                        ))}
                    </div>

                    {!isScreenshotMode && <button onClick={() => setPomodoro(prev => ({...prev, active: !prev.active}))} className={`fixed bottom-24 left-4 z-50 w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all border border-slate-700 no-screenshot ${pomodoro.active ? 'bg-red-600 animate-pulse' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>{pomodoro.active ? <span className="text-xs font-bold text-white">{Math.floor(pomodoro.time/60)}:{String(pomodoro.time%60).padStart(2,'0')}</span> : <i className="fas fa-stopwatch text-xl"></i>}</button>}

                    {showSettingsModal && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl relative"><button onClick={() => setShowSettingsModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i className="fas fa-times"></i></button><h3 className="text-white font-bold mb-4">Ayarlar</h3><form onSubmit={handleUpdateUser} className="space-y-4"><div><label className="text-xs text-slate-400">Ad Soyad</label><input name="name" defaultValue={user.name} required className="w-full input-dark p-3 rounded-lg" /></div><div><label className="text-xs text-slate-400">Üniversite</label><select name="uni" defaultValue={user.uni} className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select></div><div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked={user.enablePrayer} className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div><button className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500">Kaydet</button></form><hr className="border-slate-700 my-4" /><div className="flex gap-2"><button onClick={exportData} className="flex-1 bg-emerald-700 text-white text-xs py-2 rounded">Yedek İndir (JSON)</button><button onClick={importData} className="flex-1 bg-indigo-700 text-white text-xs py-2 rounded">Yedek Yükle</button></div></div></div>)}
                    {showTaskModal && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl"><h3 className="text-white font-bold mb-4">Yeni Hatırlatıcı</h3><div className="space-y-3"><input className="w-full input-dark p-3 rounded" placeholder="Başlık" value={newTask.title} onChange={e=>setNewTask({...newTask,title:e.target.value})} /><div className="grid grid-cols-2 gap-2"><select className="w-full input-dark p-3 rounded" value={newTask.category} onChange={e=>setNewTask({...newTask,category:e.target.value})}><option value="daily">Gündelik İş (Mavi)</option><option value="official">Resmi Toplantı (Sarı)</option></select><input type="time" className="w-full input-dark p-3 rounded" value={newTask.time} onChange={e=>setNewTask({...newTask,time:e.target.value})} /></div><input type="date" className="w-full input-dark p-3 rounded" value={newTask.date} onChange={e=>setNewTask({...newTask,date:e.target.value})} /><textarea className="w-full input-dark p-3 rounded h-20 resize-none" placeholder="Açıklama..." value={newTask.desc} onChange={e=>setNewTask({...newTask,desc:e.target.value})}></textarea><div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700"><div className="flex items-center justify-between mb-2"><span className="text-xs text-slate-300">Rutin Tekrar?</span><input type="checkbox" checked={isRecurring} onChange={e=>setIsRecurring(e.target.checked)} className="w-4 h-4 accent-blue-500" /></div>{isRecurring && (<div className="flex items-center gap-2 animate-enter"><span className="text-[10px] text-slate-400">Kaç Hafta?</span><input type="number" value={recurringWeeks} onChange={e=>setRecurringWeeks(parseInt(e.target.value))} className="w-16 bg-slate-800 border border-slate-600 rounded p-1 text-center text-white text-xs" /></div>)}</div></div><div className="flex gap-2 mt-4"><button onClick={()=>setShowTaskModal(false)} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">İptal</button><button onClick={handleAddTask} className="flex-1 py-3 rounded bg-blue-600 text-white font-bold">Kaydet</button></div></div></div>)}
                    {showLessonModal && editingLesson && (<div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4 animate-enter no-screenshot"><div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl"><h3 className="text-white font-bold mb-4">Ders Düzenle</h3><div className="mb-4"><label className="text-xs text-slate-400 block mb-1">Ders Adı</label><input className="w-full input-dark p-3 rounded" value={editingLesson.data.name} onChange={e=>setEditingLesson({...editingLesson,data:{...editingLesson.data,name:e.target.value}})} /></div><div className="mb-6"><label className="text-xs text-slate-400 block mb-1">Tür</label><div className="grid grid-cols-2 gap-2">{Object.entries(LESSON_TYPES).map(([k,v])=>(<button key={k} onClick={()=>setEditingLesson({...editingLesson,data:{...editingLesson.data,type:k}})} className={`p-2 rounded border text-xs font-bold transition ${editingLesson.data.type===k?v.color+' scale-105':'bg-slate-700 border-slate-600 text-slate-400 hover:bg-slate-700'}`}>{v.label}</button>))}</div></div><div className="flex gap-2"><button onClick={()=>setShowLessonModal(false)} className="flex-1 py-3 rounded bg-slate-700 text-slate-400 hover:bg-slate-600">İptal</button><button onClick={()=>{const n={...schedule};if(editingLesson.data.name.trim()==="")n[editingLesson.day][editingLesson.index]=null;else n[editingLesson.day][editingLesson.index]=editingLesson.data;setSchedule(n);setShowLessonModal(false)}} className="flex-1 py-3 rounded bg-blue-600 text-white font-bold">Kaydet / Sil</button></div></div></div>)}
                    
                    {/* DAY DETAIL MODAL WITH ADD BUTTON */}
                    {showDayDetailModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4 animate-enter no-screenshot">
                            <div className="bg-slate-800 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-white font-bold">{showDayDetailModal.date} Detayı</h3>
                                    <button onClick={() => setShowDayDetailModal(null)} className="text-slate-400 hover:text-white"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="space-y-3">
                                    {showDayDetailModal.events.map((ev, i) => (
                                        <div key={i} className={`p-3 rounded border-l-4 ${ev.category==='academic'?'bg-red-900/30 border-red-500': ev.category==='official'?'bg-amber-900/30 border-amber-500':'bg-blue-900/30 border-blue-500'}`}>
                                            <div className="text-sm font-bold text-white">{ev.event}</div>
                                            {ev.time && <div className="text-xs text-slate-400 mt-1"><i className="far fa-clock mr-1"></i>{ev.time}</div>}
                                            <div className="text-[10px] text-slate-500 mt-1 uppercase">{ev.origin}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-6 pt-4 border-t border-slate-700">
                                    <button onClick={() => {
                                        setNewTask({ title: "", date: showDayDetailModal.date, time: "09:00", desc: "", type: "task", category: "daily" });
                                        setShowTaskModal(true);
                                        setShowDayDetailModal(null);
                                    }} className="w-full bg-slate-700 text-white py-2 rounded-lg text-sm hover:bg-slate-600 transition flex items-center justify-center gap-2">
                                        <i className="fas fa-plus"></i> Bu Güne Hatırlatıcı Ekle
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
