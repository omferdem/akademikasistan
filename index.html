            useEffect(() => { localStorage.setItem('timeslots_vFinal', JSON.stringify(timeSlots)); }, [timeSlots]);

            const getMinutes = (timeStr) => { if(!timeStr) return 0; const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; };
            const getDayKey = (dateStr) => { const d = new Date(dateStr); const map = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"]; return map[d.getDay()]; };

            const checkConflict = (date, time) => {
                const taskExists = tasks.find(t => t.date === date && t.time === time && t.id !== editingTask?.id);
                if (taskExists) return `Çakışma: "${taskExists.title}"`;
                const dayKey = getDayKey(date);
                const daySchedule = schedule[dayKey];
                if (daySchedule) {
                    const taskMin = getMinutes(time);
                    for(let i=0; i<daySchedule.length; i++) {
                        if(daySchedule[i]) {
                            const slotTime = timeSlots[i];
                            const slotMin = getMinutes(slotTime);
                            const duration = daySchedule[i].duration ? parseInt(daySchedule[i].duration) : 1;
                            const lessonEndMin = slotMin + (duration * 60);
                            if (taskMin >= slotMin && taskMin < lessonEndMin) return `Çakışma: "${daySchedule[i].name}" dersi!`;
                        }
                    }
                }
                return null;
            };

            // PERFORMANS OPTİMİZASYONU: useMemo ile hesaplamayı önbellekle (Donmayı Önler)
            const allEvents = useMemo(() => {
                const now = new Date();
                const nowMinTotal = now.getHours() * 60 + now.getMinutes();
                const windowStart = nowMinTotal - (6 * 60); 
                const windowEnd = nowMinTotal + (18 * 60);
                
                let events = [];
                // Task'leri ekle
                tasks.forEach(t => {
                    if (!t.date || !t.time) return;
                    const tDate = new Date(t.date); 
                    if (isNaN(tDate.getTime())) return;
                    
                    const tMin = getMinutes(t.time); 
                    const diffDays = Math.round((tDate.setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                    let relativeMin = tMin + (diffDays * 1440);
                    
                    if (relativeMin >= windowStart && relativeMin <= windowEnd) {
                        events.push({ ...t, relativeMin, displayType: t.category });
                    }
                });

                // Namaz vakitlerini ekle
                if (prayerTimes && user?.enablePrayer) {
                    const map = { Fajr: "İmsak", Sunrise: "Güneş", Dhuhr: "Öğle", Asr: "İkindi", Maghrib: "Akşam", Isha: "Yatsı" };
                    [-1, 0, 1].forEach(dayOffset => {
                        Object.keys(map).forEach(k => {
                            if(prayerTimes[k]) {
                                const tMin = getMinutes(prayerTimes[k]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) {
                                    events.push({ id: `p-${k}-${dayOffset}`, title: map[k], time: prayerTimes[k], relativeMin: tMin, displayType: "prayer", desc: dayOffset === 0 ? "Bugün" : (dayOffset === 1 ? "Yarın" : "Dün") });
                                }
                            }
                        });
                    });
                }

                // Dersleri ekle
                [-1, 0, 1].forEach(dayOffset => {
                    const d = new Date(); d.setDate(d.getDate() + dayOffset);
                    const dayKey = ["Pazar", "Pazartesi", "Sali", "Carsamba", "Persembe", "Cuma", "Cumartesi"][d.getDay()];
                    const dayLessons = schedule[dayKey];
                    if (dayLessons) {
                        dayLessons.forEach((l, i) => {
                            if (l) {
                                const tMin = getMinutes(timeSlots[i]) + (dayOffset * 1440);
                                if (tMin >= windowStart && tMin <= windowEnd) events.push({ id: `l-${dayOffset}-${i}`, title: l.name, time: timeSlots[i], relativeMin: tMin, displayType: "class", lType: l.type, desc: LESSON_TYPES[l.type].label, classroom: l.classroom });
                            }
                        });
                    }
                });

                return events.sort((a, b) => a.relativeMin - b.relativeMin);
            }, [tasks, prayerTimes, user, schedule, timeSlots]); // Sadece bu veriler değişirse hesapla

            // List View artık hesaplama yapmaz, hazır veriyi kullanır
            const getTimelineList = () => {
                // Sadece bugünün ve yarının olaylarını göster (filtreleme opsiyonel)
                return allEvents.slice(0, 25); 
            };

            useEffect(() => {
                const tick = () => {
                    const now = new Date(); setCurrentTime(now);
                    setCurrentTimeStr(now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}));
                    
                    const nowTotalMin = now.getHours() * 60 + now.getMinutes();

                    // Cursor Color
                    const nextEvent = allEvents.find(ev => ev.relativeMin > nowTotalMin && ev.displayType !== 'prayer');
                    if (nextEvent) {
                        const diff = nextEvent.relativeMin - nowTotalMin;
                        if (diff <= 60) setCursorColor("bg-red-500 shadow-[0_0_15px_red]");
                        else if (diff <= 120) setCursorColor("bg-yellow-500 shadow-[0_0_10px_yellow]");
                        else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");
                    } else setCursorColor("bg-emerald-500 shadow-[0_0_10px_#10b981]");

                    setProgress(50); 

                    // Alarm
                    const upcoming = allEvents.find(ev => {
                        const diff = ev.relativeMin - nowTotalMin;
                        return diff > 0 && diff <= 5 && ev.displayType !== 'prayer';
                    });
                    if (upcoming && !dismissedAlerts.includes(upcoming.id)) {
                        if (!alertState || alertState.id !== upcoming.id) {
                            setAlertState(upcoming);
                            try{ audioRef.current.play(); } catch(e){}
                            
                            if (Notification.permission === "granted") {
                                new Notification(`HATIRLATMA: ${upcoming.title}`, {
                                    body: `${upcoming.time} - ${upcoming.desc || 'Etkinlik başlıyor!'}`,
                                    icon: "https://cdn-icons-png.flaticon.com/512/3239/3239952.png"
                                });
                            }
                        }
                    } else { if(alertState) setAlertState(null); }

                    if(pomodoro.active && pomodoro.time > 0) setPomodoro(prev => ({...prev, time: prev.time - 1}));
                    else if (pomodoro.active && pomodoro.time === 0) { 
                        setPomodoro({active: false, time: 25 * 60}); 
                        alert("Odaklanma Bitti!"); 
                         if (Notification.permission === "granted") {
                            new Notification("Pomodoro Bitti!", { body: "Mola verme zamanı." });
                        }
                    }
                };
                tick(); const timer = setInterval(tick, 1000); 
                if (user?.enablePrayer && user?.city && !prayerTimes) fetchPrayerTimes(user.city);
                return () => clearInterval(timer);
            }, [allEvents, alertState, pomodoro.active, user, dismissedAlerts]); // allEvents artık stabil bir referans

            const dismissAlert = () => { if (alertState) { setDismissedAlerts(prev => [...prev, alertState.id]); setAlertState(null); if(audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime = 0; } } };
            const fetchPrayerTimes = async (city) => { try { const d = new Date(); const res = await fetch(`https://api.aladhan.com/v1/timingsByCity/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?city=${city}&country=Turkey&method=13`); const json = await res.json(); if(json.data) setPrayerTimes(json.data.timings); } catch (e) { console.error(e); } };
            const updateAcademicCalendar = (uniName) => { const newData = ACADEMIC_DATA[uniName] || ACADEMIC_DATA['default']; setCalendarEvents(newData); };
            const handleUpdateUser = (e) => { 
                e.preventDefault(); 
                const fd = new FormData(e.target); 
                const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); 
                if (!u) return; 
                updateAcademicCalendar(u.name); 
                setUser({ ...user, title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); 
                setActiveModal(null); 
                if ("Notification" in window) Notification.requestPermission();
            };
            
            const handleAddTask = () => { 
                if(!newTask.title || !newTask.date) return;
                
                if (!conflictWarn) {
                    let msg = checkConflict(newTask.date, newTask.time);
                    if (isRecurring && !editingTask) { 
                        const d = new Date(newTask.date);
                        const check = checkConflict(d.toISOString().split('T')[0], newTask.time);
                        if(check) msg = "Rutin Başlangıcında: " + check;
                    }
                    if (msg) { setConflictWarn(msg); return; }
                }

                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask, id: t.id } : t));
                    setEditingTask(null);
                } else {
                    let taskListToAdd = [];
                    if (isRecurring) { 
                        // GÜVENLİK: Maksimum 52 hafta (1 yıl) sınırı
                        const safeWeeks = Math.min(Math.max(1, recurringWeeks || 1), 52);
                        let currentDate = new Date(newTask.date); 
                        for(let i=0; i<safeWeeks; i++) { 
                            taskListToAdd.push({
                                ...newTask, 
                                id: Date.now() + Math.random() + i, // Daha güvenli ID
                                date: currentDate.toISOString().split('T')[0], 
                                category: newTask.category, 
                                title: newTask.title, 
                                time: newTask.time, 
                                desc: newTask.desc 
                            }); 
                            currentDate.setDate(currentDate.getDate() + 7); 
                        } 
                    } else { 
                        taskListToAdd.push({...newTask, id: Date.now() + Math.random()}); 
                    } 
                    setTasks(prev => [...prev, ...taskListToAdd]); 
                }
                
                setActiveModal(null); setConflictWarn(null); setNewTask({title:"", date:"", time:"", desc:"", type:"task", category:"daily"}); setIsRecurring(false);
            };

            const openEditTask = (task) => {
                setNewTask(task);
                setEditingTask(task);
                setActiveModal('task');
                setConflictWarn(null);

            const deleteTask = (e, id) => { 
                e.stopPropagation();
                if(confirm("Görevi silmek istediğinize emin misiniz?")) { 
                    setTasks(prev => prev.filter(t => t.id !== id)); 
                    if (dayDetailData) {
                         setDayDetailData(prev => ({...prev, events: prev.events.filter(ev => ev.id !== id)}));
                    }
                } 
            };

            const handleAddNote = () => { if(!newNote) return; setNotes([{id: Date.now(), text: newNote, date: new Date().toLocaleDateString()}, ...notes]); setNewNote(""); };
            const exportData = () => { const data = JSON.stringify({ user, tasks, schedule, customScores, targetScore, notes }, null, 2); const blob = new Blob([data], {type: "text/plain"}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `akademik_yedek.txt`; a.click(); };
            const importData = () => { const input = document.createElement('input'); input.type = 'file'; input.accept = '.txt,.json'; input.onchange = (e) => { const file = e.target.files[0]; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if(data.user) setUser(data.user); if(data.tasks) setTasks(data.tasks); if(data.schedule) setSchedule(data.schedule); if(data.customScores) setCustomScores(data.customScores); if(data.notes) setNotes(data.notes); alert("Yedek yüklendi!"); window.location.reload(); } catch(err) { alert("Hata! Dosya bozuk."); } }; reader.readAsText(file); }; input.click(); };
            const handleFileUpload = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { const content = e.target.result; const lines = content.split(/\r\n|\n|\r/); let events = []; let currentEvent = null; lines.forEach(line => { if (line.startsWith('BEGIN:VEVENT')) currentEvent = {}; else if (line.startsWith('END:VEVENT')) { if (currentEvent && currentEvent.SUMMARY && currentEvent.DTSTART) { const rawDate = currentEvent.DTSTART.replace('VALUE=DATE:',''); const y = rawDate.substring(0,4); const m = rawDate.substring(4,6); const d = rawDate.substring(6,8); const h = rawDate.length > 8 ? rawDate.substring(9,11) : "08"; const min = rawDate.length > 8 ? rawDate.substring(11,13) : "00"; events.push({ id: Date.now() + Math.random(), title: currentEvent.SUMMARY, date: `${y}-${m}-${d}`, time: `${h}:${min}`, desc: "Takvimden", type: "task", category: "official", origin: "imported" }); } currentEvent = null; } else if (currentEvent) { const [key, val] = line.split(':'); if(key) currentEvent[key.split(';')[0]] = val; } }); setTasks([...tasks, ...events]); alert(`${events.length} etkinlik eklendi.`); }; reader.readAsText(file); };
            const handleDayClick = (dateStr, events) => { if (events.length > 0) { setDayDetailData({date: dateStr, events}); setActiveModal('dayDetail'); } else { setNewTask({ title: "", date: dateStr, time: "09:00", desc: "", type: "task", category: "daily" }); setActiveModal('task'); } };
            const getAllEvents = () => { const academicEvents = calendarEvents.map(e => ({ ...e, origin: 'academic', title: e.event, category: 'academic' })); const userEvents = tasks.map(t => ({ ...t, event: t.title, origin: t.origin || 'personal', category: t.category })); return [...academicEvents, ...userEvents]; };
            
            const saveLesson = () => { 
                const { day, index, data } = editingLesson; 
                const newSchedule = { ...schedule }; 
                const duration = data.duration ? parseInt(data.duration) : 1;
                if (!duration) return; 

                if (index + duration > 13) { alert("Ders günün bitiş saatini aşıyor!"); return; } 
                const batchId = data.batchId || Date.now(); 
                for (let i = 0; i < duration; i++) { 
                    newSchedule[day][index + i] = { ...data, duration: 1, batchId: batchId }; 
                } 
                setSchedule(newSchedule); setActiveModal(null); 
            };
            
            const deleteLesson = () => { 
                const { day, index, data } = editingLesson; 
                if (!data) { setActiveModal(null); return; } 
                const newSchedule = { ...schedule }; 
                if (data.batchId) { 
                    if (confirm(`"${data.name}" dersinin tümünü sil?`)) { Object.keys(newSchedule).forEach(d => { newSchedule[d] = newSchedule[d].map(l => (l && l.batchId === data.batchId) ? null : l); }); } 
                    else { newSchedule[day][index] = null; } 
                } else { newSchedule[day][index] = null; } 
                setSchedule(newSchedule); setActiveModal(null); 
            };

            const handleAddNewLesson = () => {
                if (!newLesson.name || !newLesson.startTime || !newLesson.endTime || newLesson.days.length === 0) {
                    alert("Lütfen tüm alanları doldurun ve en az bir gün seçin!");
                    return;
                }

                const startMin = getMinutes(newLesson.startTime);
                const endMin = getMinutes(newLesson.endTime);
                
                if (endMin <= startMin) {
                    alert("Bitiş saati başlangıç saatinden sonra olmalı!");
                    return;
                }

                const durationHours = Math.ceil((endMin - startMin) / 60);
                const batchId = Date.now();
                const newSchedule = { ...schedule };

                newLesson.days.forEach(day => {
                    let startSlotIndex = -1;
                    for (let i = 0; i < timeSlots.length; i++) {
                        if (getMinutes(timeSlots[i]) >= startMin) {
                            startSlotIndex = i;
                            break;
                        }
                    }

                    if (startSlotIndex === -1) {
                        alert(`${day} günü için uygun zaman dilimi bulunamadı!`);
                        return;
                    }

                    for (let i = 0; i < durationHours && (startSlotIndex + i) < timeSlots.length; i++) {
                        newSchedule[day][startSlotIndex + i] = {
                            name: newLesson.name,
                            type: newLesson.type,
                            classroom: newLesson.classroom,
                            duration: 1,
                            batchId: batchId,
                            startTime: newLesson.startTime,
                            endTime: newLesson.endTime
                        };
                    }
                });

                setSchedule(newSchedule);
                setActiveModal(null);
                setNewLesson({
                    name: "",
                    startTime: "09:00",
                    endTime: "10:00",
                    classroom: "",
                    type: "lisans",
                    days: []
                });
            };

            const toggleLessonDay = (day) => {
                setNewLesson(prev => ({
                    ...prev,
                    days: prev.days.includes(day) 
                        ? prev.days.filter(d => d !== day)
                        : [...prev.days, day]
                }));
            };

            const renderTimelineBar = () => {

                const windowStart = nowMin - (6 * 60); 
                const windowTotal = 24 * 60; 

                return (
                    <div className="h-16 relative w-full overflow-hidden flex items-center bg-slate-900 rounded-xl border border-slate-700 shadow-inner">
                        <div className="absolute top-1/2 left-0 w-full h-px bg-slate-600/50"></div>
                        <div className={`absolute top-0 bottom-0 w-1 z-30 left-[25%] transition-colors duration-500 ${cursorColor}`}></div>
                        {allEvents.map(ev => {
                            let diff = ev.relativeMin - windowStart; 
                            const positionPct = (diff / windowTotal) * 100;
                            
                            if (positionPct < 0 || positionPct > 100) return null;
                            
                            let nodeColor = "bg-gray-500"; 
                            if (ev.displayType === 'prayer') nodeColor = "bg-white w-0.5 h-full rounded-none top-0 translate-y-0";
                            else { 
                                if (ev.displayType === 'daily' || ev.displayType === 'task') nodeColor = "bg-blue-500 w-3 h-3 rounded-full border-2 border-slate-900"; 
                                else if (ev.displayType === 'official') nodeColor = "bg-amber-500 w-3 h-3 rounded-full border-2 border-slate-900"; 
                                else if (ev.displayType === 'special') nodeColor = "bg-pink-500 w-3 h-3 rounded-full border-2 border-slate-900"; 
                                else if (ev.displayType === 'class') nodeColor = "bg-emerald-500 w-3 h-3 rounded-full border-2 border-slate-900";
                            }

                            let pulseClass = ""; if ((ev.relativeMin - nowMin) > 0 && (ev.relativeMin - nowMin) < 120 && ev.displayType !== 'prayer') pulseClass = "animate-pulse scale-125"; 
                            return (<div key={ev.id} className={`absolute top-1/2 -translate-y-1/2 z-20 cursor-pointer ${nodeColor} ${pulseClass}`} style={{left: `${positionPct}%`}} onClick={() => { if(ev.displayType!=='prayer'&&ev.displayType!=='class') openEditTask(ev); else setSelectedNode(ev); }}></div>);
                        })}
                    </div>
                );
            };

            const totalCalculated = customScores.reduce((acc, curr) => acc + ( (parseInt(curr.value)||0) * (parseInt(curr.count)||0) ), 0);
            const appClass = isScreenshotMode ? "screenshot-mode bg-white min-h-screen text-black" : "max-w-md mx-auto min-h-screen bg-[#0f172a] pb-24 relative shadow-2xl overflow-hidden text-slate-100";

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#0f172a]">
                        <div className="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
                            <h1 className="text-2xl font-bold text-white mb-2 text-center">Akademik Asistan</h1>
                            <p className="text-center text-slate-400 mb-6 text-sm">V2.3 • Temiz Kurulum (Stable)</p>
                            <form onSubmit={(e) => { e.preventDefault(); const fd = new FormData(e.target); const u = UNIVERSITIES.find(x => x.name === fd.get('uni')); if (!u) return; setUser({ title: fd.get('title'), name: fd.get('name'), uni: u.name, city: u.city, url: u.url, enablePrayer: fd.get('enablePrayer') === 'on' }); }} className="space-y-4">
                                <select name="title" className="w-full input-dark p-3 rounded-lg">{TITLES.map(t=><option key={t} value={t}>{t}</option>)}</select>
                                <input name="name" required placeholder="Ad Soyad" className="w-full input-dark p-3 rounded-lg" />
                                <select name="uni" className="w-full input-dark p-3 rounded-lg">{UNIVERSITIES.map(u => <option key={u.name} value={u.name}>{u.name}</option>)}</select>
                                <div className="flex items-center gap-3 pt-2"><input type="checkbox" name="enablePrayer" defaultChecked className="w-5 h-5 accent-blue-500" /><span className="text-sm text-slate-300">Namaz Vakitlerini Göster</span></div>
                                <button className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-blue-500 transition">BAŞLAT</button>
                            </form>
                        </div>

                );

            return (
                <div className={appClass} onClick={() => {
                    if ("Notification" in window && Notification.permission !== "granted") Notification.requestPermission();
                    if(isScreenshotMode) setIsScreenshotMode(false);
                }}>
                    <audio ref={audioRef} src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
                    
                    {alertState && !isScreenshotMode && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-red-900/95 backdrop-blur-md animate-flash">
                            <div className="bg-white text-red-700 p-6 rounded-3xl shadow-2xl text-center max-w-sm mx-4 transform scale-110">
                                <i className="fas fa-exclamation-triangle text-6xl mb-4 animate-bounce"></i>
                                <h1 className="text-3xl font-bold mb-1">DİKKAT!</h1>
                                <p className="text-2xl font-bold text-black mb-2">{alertState.time}</p>
                                <p className="text-lg font-semibold">{alertState.title}</p>
                                <button onClick={dismissAlert} className="mt-6 w-full bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition shadow-lg">TAMAM, ANLAŞILDI</button>
                            </div>
                        </div>
                    )}
                    
                    {/* Header */}
                    <div className="pt-10 pb-6 px-6 bg-gradient-to-br from-blue-900 via-slate-900 to-slate-900 rounded-b-[40px] shadow-lg border-b border-blue-900/30 no-print z-20 relative no-screenshot">
                        <div className="absolute top-3 right-5 text-white/50 text-[10px] tracking-tighter signature z-50 leading-none pointer-events-none">Ömer Faruk Erdem</div>

                            <button onClick={() => setActiveModal('settings')} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center hover:text-blue-400"><i className="fas fa-cog text-xs"></i></button>
                        </div>
                        <div className="mt-6 relative">
                            <div className="flex justify-between text-[10px] text-blue-200 font-mono mb-1"><span>-6s</span><span className="animate-pulse text-white font-bold">{currentTimeStr}</span><span>+18s</span></div>
                            {renderTimelineBar()}
                            {selectedNode && (<div className="mt-2 bg-slate-800 p-2 rounded border border-slate-600 text-xs flex justify-between items-center animate-enter">
                                <div>

                                </div>

                        </div>

                                <h3 className="text-sm font-bold text-slate-400 uppercase border-b border-slate-700 pb-2 mb-4 ml-1">Günlük Akış</h3>
                                {getTimelineList().length === 0 ? <div className="text-center py-12 opacity-30 text-sm border-2 border-dashed border-slate-700 rounded-xl">Akış boş.</div> : 
                                    getTimelineList().map((item, i) => { 
                                        const nowTotalMin = new Date().getHours() * 60 + new Date().getMinutes();
                                        const isPast = item.relativeMin < nowTotalMin;
                                        
                                        let borderClass = 'border-slate-600'; 
                                        if (item.displayType === 'prayer') borderClass = 'border-white';

                                        else if (item.displayType === 'official') borderClass = 'border-amber-500'; 
                                        else if (item.displayType === 'special') borderClass = 'border-pink-500';
                                        else if (item.displayType === 'class') borderClass = 'border-emerald-500'; 
                                        
                                        const pastClass = isPast ? 'opacity-40 grayscale' : 'opacity-100';

                                        return (

                        {/* HOME */}
                        {view === 'home' && (
